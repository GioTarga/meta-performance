<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meta Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c14;
    --surface: #0c1220;
    --surface-2: #101828;
    --border: #16324a;
    --border-bright: #1f6f8f;
    --text: #d8f3ff;
    --text-secondary: #7fa8c4;
    --text-muted: #4a6a85;
    --cyan: #22e5ff;
    --cyan-dim: #0e8fae;
    --green-bg: rgba(16,255,163,0.08); --green-text: #10ffa3; --green-dot: #10ffa3;
    --amber-bg: rgba(255,183,3,0.1); --amber-text: #ffb703; --amber-dot: #ffb703;
    --red-bg: rgba(255,59,92,0.1); --red-text: #ff3b5c; --red-dot: #ff3b5c;
    --slate-dot: #4a6a85;
    --font-display: "Chakra Petch", sans-serif;
    --font-mono: "JetBrains Mono", monospace;
  }
  * { box-sizing: border-box; }
  ::selection { background: rgba(34,229,255,0.25); color: #fff; }
  body {
    margin: 0;
    font-family: var(--font-mono);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    height: 60px; padding: 0 24px;
    background: rgba(5,8,15,0.85); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  header .brand {
    font-family: var(--font-display); font-weight: 700; font-size: 16px;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--text);
    display: flex; align-items: center; gap: 10px;
  }
  header .brand .pulse {
    width: 8px; height: 8px; border-radius: 50%; background: var(--cyan);
    box-shadow: 0 0 8px 2px rgba(34,229,255,0.8);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .header-controls { display: flex; align-items: center; gap: 10px; }

  .layout { display: flex; min-height: calc(100vh - 60px); }
  nav.sidebar {
    width: 208px; flex-shrink: 0; padding: 16px 12px;
    background: rgba(10,17,32,0.5); border-right: 1px solid var(--border);
  }
  .nav-group-label {
    font-size: 9px; font-weight: 700; color: var(--text-muted);
    letter-spacing: 0.12em; text-transform: uppercase;
    padding: 14px 12px 5px; display: block;
  }
  nav.sidebar a {
    display: block; padding: 9px 12px; margin-bottom: 2px;
    border-radius: 4px; font-size: 12px; font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-secondary); text-decoration: none; cursor: pointer;
    border-left: 2px solid transparent;
  }
  nav.sidebar a.active {
    background: rgba(34,229,255,0.07); color: var(--cyan);
    border-left: 2px solid var(--cyan);
  }
  nav.sidebar a:hover:not(.active) { background: rgba(255,255,255,0.02); color: var(--text); }
  main { flex: 1; padding: 32px; max-width: 1240px; }
  .page { display: none; }
  .page.active { display: block; }
  h1 {
    font-family: var(--font-display); font-size: 22px; font-weight: 700;
    letter-spacing: 0.03em; margin: 0 0 4px; color: var(--text);
    text-transform: uppercase;
  }
  .subtitle { font-size: 12px; color: var(--text-secondary); margin: 0 0 24px; letter-spacing: 0.02em; }

  .setup-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 32px; max-width: 460px; margin: 80px auto;
  }
  .setup-card h2 { font-family: var(--font-display); font-size: 16px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.04em; }
  .setup-card p { font-size: 12px; color: var(--text-secondary); margin: 0 0 18px; line-height: 1.6; }
  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 10px; font-weight: 600; color: var(--cyan-dim);
    margin-bottom: 6px; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .field input, select {
    width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 3px;
    font-size: 12px; font-family: var(--font-mono); background: var(--bg); color: var(--text);
  }
  .field input:focus, select:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 1px rgba(34,229,255,0.3); }
  select { cursor: pointer; }
  button.primary {
    background: var(--cyan); color: #051018; border: none; border-radius: 3px;
    padding: 10px 18px; font-size: 12px; font-weight: 700; letter-spacing: 0.05em;
    text-transform: uppercase; cursor: pointer; font-family: var(--font-display);
    box-shadow: 0 0 16px rgba(34,229,255,0.35);
  }
  button.primary:hover { box-shadow: 0 0 24px rgba(34,229,255,0.55); }
  button.secondary {
    background: transparent; color: var(--cyan); border: 1px solid var(--border-bright); border-radius: 3px;
    padding: 9px 16px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
    text-transform: uppercase; cursor: pointer; font-family: var(--font-display);
  }
  button.secondary:hover { background: rgba(34,229,255,0.06); }
  .hint { font-size: 10px; color: var(--text-muted); margin-top: 8px; letter-spacing: 0.02em; }

  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .metric-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 18px;
  }
  .metric-card .label {
    font-size: 10px; color: var(--text-secondary); margin-bottom: 8px;
    letter-spacing: 0.08em; text-transform: uppercase; font-family: var(--font-mono);
  }
  .metric-card .value {
    font-size: 22px; font-weight: 700; font-family: var(--font-display); color: var(--text);
    text-shadow: 0 0 12px rgba(34,229,255,0.15);
  }
  .metric-card .sub { font-size: 10px; color: var(--text-muted); margin-top: 6px; }

  /* ── Health Score bars ── */
  .score-bar-track {
    height: 5px; border-radius: 3px; background: rgba(255,255,255,0.06); overflow: hidden;
  }
  .score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
  .score-bar-green { background: var(--green-text); box-shadow: 0 0 6px rgba(16,255,163,0.4); }
  .score-bar-amber { background: var(--amber-text); box-shadow: 0 0 6px rgba(255,183,3,0.4); }
  .score-bar-red   { background: var(--red-text);   box-shadow: 0 0 6px rgba(255,59,92,0.4);  }

  /* ── Diagnóstico items ── */
  .diag-critical { background: var(--red-bg);   border: 1px solid rgba(255,59,92,0.2);  }
  .diag-warning  { background: var(--amber-bg); border: 1px solid rgba(255,183,3,0.2);  }
  .diag-good     { background: var(--green-bg); border: 1px solid rgba(16,255,163,0.2); }

  /* ── KPI card variants ── */
  .kpi-accent {
    border-top: 2px solid var(--cyan) !important;
  }
  .kpi-accent .label { color: var(--cyan-dim) !important; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  thead th {
    text-align: left; padding: 11px 14px; font-size: 10px; font-weight: 600; color: var(--cyan-dim);
    background: var(--surface-2); border-bottom: 1px solid var(--border); white-space: nowrap;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  tbody td { padding: 11px 14px; border-bottom: 1px solid rgba(22,50,74,0.4); white-space: nowrap; color: var(--text); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(34,229,255,0.03); }
  .table-wrap { overflow-x: auto; border-radius: 8px; position: relative; transition: box-shadow 0.15s; }
  .table-wrap.scroll-right { box-shadow: inset -24px 0 16px -20px rgba(34,229,255,0.12); }
  .table-wrap.scroll-left { box-shadow: inset 24px 0 16px -20px rgba(34,229,255,0.12); }
  .table-wrap.scroll-right.scroll-left { box-shadow: inset -24px 0 16px -20px rgba(34,229,255,0.12), inset 24px 0 16px -20px rgba(34,229,255,0.12); }
  .scroll-nudge { font-size: 10px; color: var(--text-muted); margin: 8px 2px 0; display: none; letter-spacing: 0.03em; }
  .table-wrap.scroll-right ~ .scroll-nudge { display: block; }

  .badge {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 3px;
    font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; border: 1px solid;
  }
  .badge.green { background: var(--green-bg); color: var(--green-text); border-color: rgba(16,255,163,0.3); }
  .badge.amber { background: var(--amber-bg); color: var(--amber-text); border-color: rgba(255,183,3,0.3); }
  .badge.red { background: var(--red-bg); color: var(--red-text); border-color: rgba(255,59,92,0.3); }
  .badge.slate { background: rgba(74,106,133,0.1); color: var(--text-muted); border-color: var(--border); }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; }
  .badge.green .dot { background: var(--green-dot); box-shadow: 0 0 6px var(--green-dot); }
  .badge.amber .dot { background: var(--amber-dot); box-shadow: 0 0 6px var(--amber-dot); }
  .badge.red .dot { background: var(--red-dot); box-shadow: 0 0 6px var(--red-dot); }
  .badge.slate .dot { background: var(--slate-dot); }

  .alert-card { border-radius: 8px; padding: 18px; border-left: 3px solid; margin-bottom: 10px; background: var(--surface); border-top: 1px solid var(--border); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .alert-card.critico { border-left-color: var(--red-text); box-shadow: -3px 0 16px -6px rgba(255,59,92,0.3); }
  .alert-card.importante { border-left-color: var(--amber-text); box-shadow: -3px 0 16px -6px rgba(255,183,3,0.25); }
  .alert-card.oportunidade { border-left-color: var(--green-text); box-shadow: -3px 0 16px -6px rgba(16,255,163,0.25); }
  .alert-card .level { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; font-family: var(--font-display); }
  .alert-card.critico .level { color: var(--red-text); }
  .alert-card.importante .level { color: var(--amber-text); }
  .alert-card.oportunidade .level { color: var(--green-text); }
  .alert-card .problem { font-weight: 600; font-size: 13px; margin: 8px 0; color: var(--text); }
  .alert-card dl { margin: 0; font-size: 11px; }
  .alert-card dl div { margin-bottom: 4px; color: var(--text-secondary); line-height: 1.5; }
  .alert-card dl b { color: var(--cyan-dim); font-weight: 600; }

  .empty-state { text-align: center; padding: 70px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
  .empty-state h3 { font-family: var(--font-display); font-size: 15px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text); }
  .empty-state p { font-size: 12px; color: var(--text-secondary); max-width: 380px; margin: 0 auto; line-height: 1.6; }

  .loading { text-align: center; padding: 70px; color: var(--cyan-dim); font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; }
  .loading::after { content: ""; display: inline-block; width: 10px; }
  .section { margin-bottom: 28px; }
  .section h2 {
    font-family: var(--font-display); font-size: 12px; font-weight: 600; margin: 0 0 12px;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--cyan-dim);
  }
  .flag { display: inline-block; font-size: 9px; font-weight: 600; padding: 2px 7px; border-radius: 3px; margin-right: 4px; margin-top: 5px; letter-spacing: 0.03em; text-transform: uppercase; }
  .flag.red { background: var(--red-bg); color: var(--red-text); border: 1px solid rgba(255,59,92,0.3); }
  .flag.amber { background: var(--amber-bg); color: var(--amber-text); border: 1px solid rgba(255,183,3,0.3); }

  .period-select {
    width: auto; min-width: 150px; padding: 7px 10px; font-size: 11px;
  }
  .period-custom { display: flex; gap: 6px; align-items: center; }
  .period-custom input[type="date"] { width: auto; padding: 6px 8px; font-size: 11px; }
</style>
</head>
<body>

<header>
  <span class="brand"><span class="pulse"></span>Meta Performance</span>
  <div id="header-controls"></div>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main id="main"></main>
</div>

<script>
const NAV_GROUPS = [
  { label: "PERFORMANCE", items: [
    { id: "overview",   label: "Overview" },
    { id: "campanhas",  label: "Campanhas" },
    { id: "adsets",     label: "Ad Sets" },
    { id: "criativos",  label: "Criativos" },
  ]},
  { label: "ANÁLISE", items: [
    { id: "benchmark",  label: "Benchmark" },
    { id: "alertas",    label: "Alertas" },
    { id: "andromeda",  label: "Andromeda" },
  ]},
  { label: "PLANEJAMENTO", items: [
    { id: "plano",      label: "Plano de ação" },
  ]},
  { label: "SISTEMA", items: [
    { id: "configuracoes", label: "⚙ Configurações" },
  ]},
];

const PERIOD_PRESETS = [
  { id: "7",  label: "Últimos 7 dias",  days: 7  },
  { id: "14", label: "Últimos 14 dias", days: 14 },
  { id: "30", label: "Últimos 30 dias", days: 30 },
  { id: "60", label: "Últimos 60 dias", days: 60 },
  { id: "90", label: "Últimos 90 dias", days: 90 },
  { id: "custom", label: "Período personalizado", days: null },
];

function computePeriod(presetId) {
  const preset = PERIOD_PRESETS.find(p => p.id === presetId) || PERIOD_PRESETS[2];
  if (preset.id === "custom") {
    const fallback = computePeriod("30");
    return { preset: "custom", since: state.period?.since || fallback.since, until: state.period?.until || fallback.until };
  }
  const until = new Date();
  const since = new Date();
  since.setDate(since.getDate() - preset.days);
  const fmt = d => d.toISOString().split("T")[0];
  return { preset: preset.id, since: fmt(since), until: fmt(until) };
}

const BENCHMARK = {
  cpm: { min: 15, max: 35 },
  cpl: { min: 0, max: 27.66 },
  ctr: { min: 1.42, max: 2.59 },
  cpc: { min: 1.92, max: 2.52 },
  alertFrequency: 2.5,
  minAudience: 50000,
};

const ACTION_LABELS = {
  "onsite_conversion.messaging_conversation_started_7d": "Conversas iniciadas",
  "onsite_conversion.lead_grouped": "Leads",
  "offsite_conversion.fb_pixel_lead": "Leads (pixel)",
  "lead": "Leads",
  "leadgen.other": "Leads",
  "link_click": "Cliques no link",
  "purchase": "Compras",
  "offsite_conversion.fb_pixel_purchase": "Compras (pixel)",
  "post_engagement": "Engajamentos",
};

let state = {
  token: localStorage.getItem("meta_perf_token") || "",
  accountId: localStorage.getItem("meta_perf_account") || "",
  period: computePeriod("30"),
  statusScope: localStorage.getItem("meta_perf_status_scope") || "active",
  accounts: [],
  campaigns: [],
  adSets: [],
  ads: [],
  timeSeries: [],
  currentPage: "overview",
  loading: false,
  error: null,
};

// ---------- Graph API helpers ----------

async function graphGet(path, params) {
  const url = new URL(`https://graph.facebook.com/v21.0${path}`);
  url.searchParams.set("access_token", state.token);
  for (const [k, v] of Object.entries(params || {})) {
    if (v !== undefined) url.searchParams.set(k, v);
  }
  const res = await fetch(url.toString());
  const json = await res.json();
  if (!res.ok || json.error) {
    throw new Error(json?.error?.message || `Erro na Graph API (${res.status})`);
  }
  return json;
}

function toNum(v) {
  if (v === undefined || v === null || v === "") return null;
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}

function primaryResult(insight) {
  const actions = insight?.actions;
  if (!actions || actions.length === 0) return { results: null, costPerResult: null, resultType: null };
  const known = actions.filter(a => ACTION_LABELS[a.action_type]);
  const candidates = known.length > 0 ? known : actions;
  const best = candidates.reduce((max, cur) => (toNum(cur.value) || 0) > (toNum(max.value) || 0) ? cur : max, candidates[0]);
  const results = toNum(best.value);
  const resultType = ACTION_LABELS[best.action_type] || best.action_type;
  const costEntry = insight?.cost_per_action_type?.find(c => c.action_type === best.action_type);
  return { results, costPerResult: costEntry ? toNum(costEntry.value) : null, resultType };
}

function normalizeMetrics(insight) {
  if (!insight) return { spend: null, impressions: null, reach: null, cpm: null, ctr: null, cpc: null, frequency: null, results: null, costPerResult: null, resultType: null };
  const { results, costPerResult, resultType } = primaryResult(insight);
  return {
    spend: toNum(insight.spend), impressions: toNum(insight.impressions), reach: toNum(insight.reach),
    cpm: toNum(insight.cpm), ctr: toNum(insight.ctr), cpc: toNum(insight.cpc), frequency: toNum(insight.frequency),
    results, costPerResult, resultType,
  };
}

function dateRange() {
  return { since: state.period.since, until: state.period.until };
}

async function fetchAccounts() {
  const res = await graphGet("/me/adaccounts", { fields: "id,name,currency" });
  return res.data || [];
}

async function fetchBundle(accountId) {
  const { since, until } = dateRange();
  const insightFields = "spend,impressions,reach,cpm,ctr,cpc,frequency,actions,cost_per_action_type";
  const timeRangeParam = `{'since':'${since}','until':'${until}'}`;
  const statusFilter = state.statusScope === "all"
    ? undefined
    : JSON.stringify(["ACTIVE"]);

  const [campaignsRes, adsetsRes, adsRes] = await Promise.all([
    graphGet(`/${accountId}/campaigns`, {
      fields: `id,name,objective,effective_status,daily_budget,bid_strategy,insights.time_range(${timeRangeParam}){${insightFields}}`,
      effective_status: statusFilter, limit: 200,
    }),
    graphGet(`/${accountId}/adsets`, {
      fields: `id,name,campaign_id,optimization_goal,start_time,daily_budget,effective_status,targeting,insights.time_range(${timeRangeParam}){${insightFields}}`,
      effective_status: statusFilter, limit: 200,
    }),
    graphGet(`/${accountId}/ads`, {
      fields: `id,name,adset_id,campaign_id,effective_status,creative{id,name},insights.time_range(${timeRangeParam}){${insightFields}}`,
      effective_status: statusFilter, limit: 200,
    }),
  ]);

  const campaignNameById = new Map((campaignsRes.data || []).map(c => [c.id, c.name]));
  const adsetNameById = new Map((adsetsRes.data || []).map(a => [a.id, a.name]));

  const campaigns = (campaignsRes.data || []).map(c => ({
    id: c.id, name: c.name, objective: c.objective || null,
    effectiveStatus: c.effective_status || null,
    dailyBudget: c.daily_budget ? toNum(c.daily_budget) / 100 : null,
    metrics: normalizeMetrics(c.insights?.data?.[0]),
  }));

  const adSets = (adsetsRes.data || []).map(a => {
    const metrics = normalizeMetrics(a.insights?.data?.[0]);
    const estimatedAudience = a.targeting?.audience_size_lower_bound ?? null;
    let daysActive = null;
    if (a.start_time) daysActive = Math.floor((Date.now() - new Date(a.start_time).getTime()) / 86400000);
    return {
      id: a.id, name: a.name, campaignId: a.campaign_id, campaignName: campaignNameById.get(a.campaign_id) || "Não disponível",
      effectiveStatus: a.effective_status || null,
      dailyBudget: a.daily_budget ? toNum(a.daily_budget) / 100 : null,
      estimatedAudience, daysActive, metrics,
      saturationFlag: (metrics.frequency || 0) > BENCHMARK.alertFrequency,
      audienceTooSmallFlag: estimatedAudience !== null ? estimatedAudience < BENCHMARK.minAudience : false,
      reviewCandidateFlag: (daysActive || 0) > 90 && (metrics.frequency || 0) > BENCHMARK.alertFrequency,
    };
  });

  const ads = (adsRes.data || []).map(a => ({
    id: a.id, name: a.name, adSetId: a.adset_id,
    adSetName: adsetNameById.get(a.adset_id) || "Não disponível",
    campaignId: a.campaign_id, campaignName: campaignNameById.get(a.campaign_id) || "Não disponível",
    effectiveStatus: a.effective_status || null,
    metrics: normalizeMetrics(a.insights?.data?.[0]),
  }));

  let timeSeries = [];
  try {
    const tsRes = await graphGet(`/${accountId}/insights`, {
      fields: insightFields,
      time_range: timeRangeParam.replace(/'/g, '"'),
      time_increment: 1,
      limit: 500,
    });
    timeSeries = (tsRes.data || []).map(d => ({ date: d.date_start, ...normalizeMetrics(d) }));
  } catch (e) {
    timeSeries = [];
  }

  return { campaigns, adSets, ads, since, until, timeSeries };
}

// ---------- Diagnostics (client-side) ----------

function classifyRange(value, min, max, lowerIsBetter) {
  if (value === null) return "unknown";
  if (lowerIsBetter) {
    if (value <= max) return "green";
    if (value <= max * 1.3) return "amber";
    return "red";
  }
  if (value >= min) return "green";
  if (value >= min * 0.7) return "amber";
  return "red";
}

function campaignHealth(c) {
  const cpmS = classifyRange(c.metrics.cpm, BENCHMARK.cpm.min, BENCHMARK.cpm.max, true);
  const ctrS = classifyRange(c.metrics.ctr, BENCHMARK.ctr.min, BENCHMARK.ctr.max, false);
  const statuses = [cpmS, ctrS].filter(s => s !== "unknown");
  if (statuses.length === 0) return "unknown";
  if (statuses.includes("red")) return "red";
  if (statuses.includes("amber")) return "amber";
  return "green";
}

function adSetHealth(a) {
  if (a.saturationFlag || a.audienceTooSmallFlag) return "red";
  const cpmS = classifyRange(a.metrics.cpm, BENCHMARK.cpm.min, BENCHMARK.cpm.max, true);
  return cpmS;
}

function generateAlerts(campaigns, adSets, ads) {
  const alerts = [];
  adSets.forEach(a => {
    if (a.saturationFlag) {
      alerts.push({ level: "critico", problem: `O ad set "${a.name}" está com frequência ${a.metrics.frequency?.toFixed(2)}, acima do limite saudável de ${BENCHMARK.alertFrequency}.`,
        cause: "A audiência está sendo exposta ao mesmo criativo repetidamente — o público disponível já foi esgotado para o orçamento atual.",
        impact: "Isso pressiona o CPM para cima e reduz a eficiência do investimento.",
        recommendation: "Testar novos criativos e/ou ampliar a audiência." });
    }
    if (a.audienceTooSmallFlag) {
      alerts.push({ level: "critico", problem: `O ad set "${a.name}" tem audiência estimada de ${a.estimatedAudience.toLocaleString("pt-BR")}, abaixo do mínimo de ${BENCHMARK.minAudience.toLocaleString("pt-BR")}.`,
        cause: "A segmentação está restringindo demais o público disponível.",
        impact: "Com pouca gente para alcançar, a saturação chega rápido e o custo por resultado tende a subir.",
        recommendation: "Ampliar raio geográfico ou critérios de interesse." });
    }
    if (a.reviewCandidateFlag) {
      alerts.push({ level: "importante", problem: `O ad set "${a.name}" está ativo há ${a.daysActive} dias e já apresenta frequência elevada.`,
        cause: "Estruturas antigas sem renovação de criativo esgotam a audiência gradualmente sob o motor de entrega atual.",
        impact: "Performance tende a degradar progressivamente se nada for renovado.",
        recommendation: "Revisar: pausar, criar variações novas, ou consolidar a estrutura." });
    }
  });
  campaigns.forEach(c => {
    if (c.metrics.ctr !== null && c.metrics.ctr < BENCHMARK.ctr.min * 0.7) {
      alerts.push({ level: "importante", problem: `A campanha "${c.name}" tem CTR de ${c.metrics.ctr.toFixed(2)}%, bem abaixo do benchmark de ${BENCHMARK.ctr.min}–${BENCHMARK.ctr.max}%.`,
        cause: "O criativo pode não estar ressoando com a audiência ou o público está amplo demais.",
        impact: "CTR baixo geralmente eleva o CPM e reduz o volume de resultados pelo mesmo orçamento.",
        recommendation: "Testar novos ângulos de criativo e revisar a segmentação." });
    }
  });
  if (ads.length > 0 && ads.length < 5) {
    alerts.push({ level: "oportunidade", problem: `A conta está rodando apenas ${ads.length} criativo(s) ativo(s), abaixo da referência de 8–15.`,
      cause: "Poucas variações limitam a capacidade do algoritmo de encontrar o ângulo que melhor converte.",
      impact: "Maior chance de fadiga de criativo acelerada.",
      recommendation: "Produzir 5–10 variações adicionais e testar em paralelo." });
  }
  if (alerts.length === 0 && campaigns.length > 0) {
    alerts.push({ level: "oportunidade", problem: "Nenhum problema crítico identificado nos dados coletados.",
      cause: "CPM, CTR e frequência estão dentro das faixas saudáveis.",
      impact: "Conta operando de forma estável no período.",
      recommendation: "Manter monitoramento periódico e testar incrementos de criativo." });
  }
  const order = { critico: 0, importante: 1, oportunidade: 2 };
  return alerts.sort((a, b) => order[a.level] - order[b.level]);
}

function healthScore(campaigns, adSets, ads) {
  const avg = arr => { const v = arr.filter(x => x !== null); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; };
  const avgCtr = avg(campaigns.map(c => c.metrics.ctr));
  const ctrScore = avgCtr === null ? 50 : Math.min(100, Math.max(0, (avgCtr / BENCHMARK.ctr.max) * 100));
  const avgCpm = avg(campaigns.map(c => c.metrics.cpm));
  const cpmScore = avgCpm === null ? 50 : Math.min(100, Math.max(0, (1 - avgCpm / (BENCHMARK.cpm.max * 1.5)) * 100));
  const avgFreq = avg(adSets.map(a => a.metrics.frequency));
  const freqScore = avgFreq === null ? 50 : Math.min(100, Math.max(0, (1 - avgFreq / (BENCHMARK.alertFrequency * 2)) * 100));
  const creativeScore = ads.length === 0 ? 0 : Math.min(100, (Math.min(ads.length, 15) / 15) * 100);
  const perCampaign = campaigns.length > 0 ? adSets.length / campaigns.length : 0;
  const structureScore = perCampaign === 0 ? 50 : perCampaign <= 2 ? 100 : Math.max(0, 100 - (perCampaign - 2) * 15);
  const score = Math.round(ctrScore*0.25 + cpmScore*0.25 + freqScore*0.2 + creativeScore*0.15 + structureScore*0.15);
  return { score: Math.min(100, Math.max(0, score)), ctrScore: Math.round(ctrScore), cpmScore: Math.round(cpmScore), freqScore: Math.round(freqScore), creativeScore: Math.round(creativeScore), structureScore: Math.round(structureScore) };
}

function scoreColor(s) {
  if (s >= 70) return "var(--green-text)";
  if (s >= 40) return "var(--amber-text)";
  return "var(--red-text)";
}
function scoreBg(s) {
  if (s >= 70) return "var(--green-bg)";
  if (s >= 40) return "var(--amber-bg)";
  return "var(--red-bg)";
}
function scoreBarClass(s) {
  if (s >= 70) return "score-bar-green";
  if (s >= 40) return "score-bar-amber";
  return "score-bar-red";
}
function overallLabel(s) {
  if (s >= 80) return "EXCELENTE";
  if (s >= 60) return "BOM";
  if (s >= 40) return "ATENÇÃO NECESSÁRIA";
  return "CRÍTICO";
}
function diagMessage(key, score) {
  const map = {
    CTR:        ["CTR criticamente baixo. Revisar criativos e segmentação.",              "CTR abaixo do ideal. Testar novos formatos de anúncio.",         "CTR em bom nível. Manter a segmentação atual."],
    CPM:        ["CPM elevado. Audiência muito competitiva ou saturada.",                 "CPM aceitável. Monitorar evolução semanal.",                      "CPM eficiente. Boa relação com a audiência."],
    Frequência: ["Frequência alta. Risco elevado de fadiga de anúncio.",                 "Frequência em zona de atenção. Renovar criativos em breve.",     "Frequência saudável. Sem risco de saturação."],
    Criativos:  ["Diversidade de criativos crítica. Adicionar novos formatos urgente.",  "Poucos criativos ativos. Ampliar variedade de anúncios.",        "Boa diversidade de criativos. Seguir testando."],
    Estrutura:  ["Estrutura de conta com problemas. Revisar organização das campanhas.", "Estrutura pode ser otimizada.",                                  "Estrutura de conta organizada e saudável."],
  };
  const msgs = map[key] || ["", "", ""];
  return score < 40 ? msgs[0] : score < 70 ? msgs[1] : msgs[2];
}

// ---------- Gráfico de evolução (SVG puro, sem dependências) ----------

function buildLineChart(series, config) {
  const { key, label, color, isCurrency } = config;
  const width = 560, height = 200, padding = { top: 12, right: 12, bottom: 22, left: 44 };
  const points = series.map(d => ({ date: d.date, value: d[key] }));
  const values = points.map(p => p.value).filter(v => v !== null && v !== undefined);

  if (values.length === 0) {
    return `<div style="padding:24px;text-align:center;color:var(--text-muted);font-size:12px;border:1px dashed var(--border);border-radius:10px">Sem dados de "${label}" disponíveis para o período.</div>`;
  }

  const maxV = Math.max(...values, 0.0001);
  const minV = Math.min(...values, 0);
  const range = maxV - minV || 1;
  const innerW = width - padding.left - padding.right;
  const innerH = height - padding.top - padding.bottom;

  const coords = points.map((p, i) => {
    const x = padding.left + (i / Math.max(points.length - 1, 1)) * innerW;
    const y = p.value === null ? null : padding.top + innerH - ((p.value - minV) / range) * innerH;
    return { x, y, date: p.date, value: p.value };
  });

  const validCoords = coords.filter(c => c.y !== null);
  const pathD = validCoords.map((c, i) => `${i === 0 ? "M" : "L"} ${c.x.toFixed(1)} ${c.y.toFixed(1)}`).join(" ");
  const areaD = validCoords.length > 0
    ? `${pathD} L ${validCoords[validCoords.length - 1].x.toFixed(1)} ${(padding.top + innerH).toFixed(1)} L ${validCoords[0].x.toFixed(1)} ${(padding.top + innerH).toFixed(1)} Z`
    : "";

  const dots = validCoords.map(c => `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="2.5" fill="${color}"><title>${c.date}: ${isCurrency ? fmtCurrency(c.value) : fmtNum(c.value, 0)}</title></circle>`).join("");

  const firstLabel = points[0]?.date ? points[0].date.slice(5) : "";
  const lastLabel = points[points.length - 1]?.date ? points[points.length - 1].date.slice(5) : "";

  return `
    <svg viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;overflow:visible">
      <line x1="${padding.left}" y1="${padding.top}" x2="${padding.left}" y2="${padding.top + innerH}" stroke="var(--border)" stroke-width="1" />
      <line x1="${padding.left}" y1="${padding.top + innerH}" x2="${width - padding.right}" y2="${padding.top + innerH}" stroke="var(--border)" stroke-width="1" />
      <text x="${padding.left - 6}" y="${padding.top + 4}" text-anchor="end" font-size="9" fill="var(--text-muted)">${isCurrency ? fmtCurrency(maxV) : fmtNum(maxV)}</text>
      <text x="${padding.left - 6}" y="${padding.top + innerH}" text-anchor="end" font-size="9" fill="var(--text-muted)">${isCurrency ? fmtCurrency(minV) : fmtNum(minV)}</text>
      <text x="${padding.left}" y="${height - 4}" font-size="9" fill="var(--text-muted)">${firstLabel}</text>
      <text x="${width - padding.right}" y="${height - 4}" text-anchor="end" font-size="9" fill="var(--text-muted)">${lastLabel}</text>
      <path d="${areaD}" fill="${color}" opacity="0.08" />
      <path d="${pathD}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
      ${dots}
    </svg>`;
}

function rankAds(ads) {
  const withData = ads.filter(a => a.metrics.costPerResult !== null);
  const withoutData = ads.filter(a => a.metrics.costPerResult === null);
  const sorted = [...withData].sort((a, b) => {
    const cost = (a.metrics.costPerResult ?? Infinity) - (b.metrics.costPerResult ?? Infinity);
    if (cost !== 0) return cost;
    return (b.metrics.ctr ?? 0) - (a.metrics.ctr ?? 0);
  });
  const ranked = sorted.map((ad, i) => {
    const rank = i + 1;
    const cls = rank <= Math.ceil(sorted.length * 0.3) ? "vencedor" : rank > Math.floor(sorted.length * 0.7) ? "perdedor" : "neutro";
    return { ...ad, rank, cls };
  });
  return [...ranked, ...withoutData.map(a => ({ ...a, rank: null, cls: "unknown" }))];
}

// ---------- Formatting ----------

function fmtCurrency(v) { return v === null || v === undefined ? "Não disponível" : v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
function fmtNum(v, decimals = 0, suffix = "") { return v === null || v === undefined ? "Não disponível" : v.toLocaleString("pt-BR", { minimumFractionDigits: decimals, maximumFractionDigits: decimals }) + suffix; }
function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

function badgeHtml(status) {
  const cfg = { green: ["Saudável", "green"], amber: ["Atenção", "amber"], red: ["Crítico", "red"], unknown: ["Sem dados", "slate"] }[status] || ["Sem dados", "slate"];
  return `<span class="badge ${cfg[1]}"><span class="dot"></span>${cfg[0]}</span>`;
}

const EFFECTIVE_STATUS_LABELS = {
  ACTIVE: ["Ativa", "green"], PAUSED: ["Pausada", "slate"], CAMPAIGN_PAUSED: ["Pausada (campanha)", "slate"],
  ADSET_PAUSED: ["Pausada (ad set)", "slate"], ARCHIVED: ["Arquivada", "slate"], DELETED: ["Excluída", "slate"],
  PENDING_REVIEW: ["Em revisão", "amber"], DISAPPROVED: ["Reprovada", "red"], PREAPPROVED: ["Pré-aprovada", "amber"],
  PENDING_BILLING_INFO: ["Pendente de pagamento", "amber"], IN_PROCESS: ["Em processamento", "amber"],
  WITH_ISSUES: ["Com problemas", "red"],
};

function statusBadgeHtml(effectiveStatus) {
  if (!effectiveStatus) return `<span class="badge slate"><span class="dot"></span>Não disponível</span>`;
  const cfg = EFFECTIVE_STATUS_LABELS[effectiveStatus] || [effectiveStatus, "slate"];
  return `<span class="badge ${cfg[1]}"><span class="dot"></span>${cfg[0]}</span>`;
}

// ---------- Render ----------

function render() {
  renderHeader();
  renderSidebar();
  renderMain();
}

function renderHeader() {
  const el = document.getElementById("header-controls");
  if (!state.token) { el.innerHTML = ""; return; }
  const opts = state.accounts.map(a => `<option value="${a.id}" ${a.id === state.accountId ? "selected" : ""}>${esc(a.name || a.id)}</option>`).join("");

  const periodOpts = PERIOD_PRESETS.map(p =>
    `<option value="${p.id}" ${state.period.preset === p.id ? "selected" : ""}>${p.label}</option>`
  ).join("");

  const customRange = state.period.preset === "custom"
    ? `<div class="period-custom">
        <input type="date" id="since-input" value="${state.period.since}" />
        <span style="color:var(--text-muted);font-size:11px">até</span>
        <input type="date" id="until-input" value="${state.period.until}" />
        <button class="secondary" id="apply-custom-range" style="padding:6px 10px">Aplicar</button>
      </div>`
    : "";

  el.innerHTML = `
    <div class="header-controls">
      <select id="status-scope-select" class="period-select" style="min-width:170px">
        <option value="active" ${state.statusScope === "active" ? "selected" : ""}>Apenas ativas</option>
        <option value="all" ${state.statusScope === "all" ? "selected" : ""}>Todas (inclui pausadas)</option>
      </select>
      <select id="period-select" class="period-select">${periodOpts}</select>
      ${customRange}
      <select id="account-select" style="width:220px">${opts || '<option value="">Nenhuma conta</option>'}</select>
    </div>`;

  const statusSel = document.getElementById("status-scope-select");
  if (statusSel) statusSel.onchange = (e) => {
    state.statusScope = e.target.value;
    localStorage.setItem("meta_perf_status_scope", state.statusScope);
    loadAccountData();
  };

  const sel = document.getElementById("account-select");
  if (sel) sel.onchange = (e) => { state.accountId = e.target.value; localStorage.setItem("meta_perf_account", state.accountId); loadAccountData(); };

  const periodSel = document.getElementById("period-select");
  if (periodSel) periodSel.onchange = (e) => {
    const preset = e.target.value;
    state.period = computePeriod(preset);
    render();
    if (preset !== "custom") loadAccountData();
  };

  const applyBtn = document.getElementById("apply-custom-range");
  if (applyBtn) applyBtn.onclick = () => {
    const since = document.getElementById("since-input").value;
    const until = document.getElementById("until-input").value;
    if (since && until) {
      state.period = { preset: "custom", since, until };
      loadAccountData();
    }
  };
}

function renderSidebar() {
  const el = document.getElementById("sidebar");
  if (!state.token) { el.innerHTML = ""; return; }
  el.innerHTML = NAV_GROUPS.map(group => `
    <span class="nav-group-label">${group.label}</span>
    ${group.items.map(item =>
      `<a class="${state.currentPage === item.id ? "active" : ""}" data-page="${item.id}">${item.label}</a>`
    ).join("")}
  `).join("");
  el.querySelectorAll("a").forEach(a => a.onclick = () => { state.currentPage = a.dataset.page; render(); });
}

function renderMain() {
  const el = document.getElementById("main");

  if (!state.token) {
    el.innerHTML = `
      <div class="setup-card">
        <h2>Conectar Meta Performance</h2>
        <p>Cole seu access token da Meta Graph API (gerado no Graph API Explorer, com permissão ads_read). Ele fica salvo só no seu navegador — nunca é enviado a nenhum servidor além da própria Meta.</p>
        <div class="field"><label>Access token</label><input id="token-input" type="password" placeholder="EAA..." /></div>
        <button class="primary" id="connect-btn">Conectar</button>
        <p class="hint">Gere em developers.facebook.com/tools/explorer</p>
      </div>`;
    document.getElementById("connect-btn").onclick = async () => {
      const val = document.getElementById("token-input").value.trim();
      if (!val) return;
      state.token = val;
      localStorage.setItem("meta_perf_token", val);
      await bootstrapAccounts();
    };
    return;
  }

  // Configurações sempre acessível, independente de token ou erro
  if (state.currentPage === "configuracoes") {
    el.innerHTML = renderConfiguracoes();
    return;
  }

  if (state.loading) { el.innerHTML = `<div class="loading">Carregando dados da conta…</div>`; return; }

  if (state.error) {
    el.innerHTML = `<div class="empty-state"><h3>Erro ao consultar a Meta Marketing API</h3><p>${esc(state.error)}</p><div style="display:flex;gap:10px;justify-content:center;margin-top:16px"><button class="secondary" id="retry-btn">Tentar de novo</button><button class="primary" id="go-config-btn">Atualizar Token</button></div></div>`;
    document.getElementById("retry-btn").onclick = () => loadAccountData();
    document.getElementById("go-config-btn").onclick = () => { state.currentPage = "configuracoes"; render(); };
    return;
  }

  if (!state.accountId) {
    el.innerHTML = `<div class="empty-state"><h3>Nenhuma conta selecionada</h3><p>Selecione uma conta no seletor no topo da página.</p></div>`;
    return;
  }

  const pages = {
    overview: renderOverview, campanhas: renderCampanhas, adsets: renderAdSets,
    criativos: renderCriativos, benchmark: renderBenchmark, alertas: renderAlertas,
    andromeda: renderAndromeda, plano: renderPlano, configuracoes: renderConfiguracoes,
  };
  el.innerHTML = (pages[state.currentPage] || renderOverview)();
  setupTableScrollHints();
}

function setupTableScrollHints() {
  document.querySelectorAll(".table-wrap").forEach(wrap => {
    const update = () => {
      const scrollable = wrap.scrollWidth > wrap.clientWidth + 1;
      wrap.classList.toggle("scroll-right", scrollable && wrap.scrollLeft < wrap.scrollWidth - wrap.clientWidth - 1);
      wrap.classList.toggle("scroll-left", wrap.scrollLeft > 1);
    };
    update();
    wrap.addEventListener("scroll", update);
    window.addEventListener("resize", update);
  });
}

// ---------- renderOverview — redesigned ----------

function renderOverview() {
  const { campaigns, adSets, ads } = state;
  const sum = arr => arr.some(v => v !== null) ? arr.reduce((a, v) => a + (v || 0), 0) : null;
  const avg = arr => { const v = arr.filter(x => x !== null); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; };

  const hs            = healthScore(campaigns, adSets, ads);

  const overColor = scoreColor(hs.score);

function renderBenchmark() {
  const { campaigns, adSets } = state;
  const avg = arr => { const v = arr.filter(x => x !== null); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; };
  const cpm = avg(campaigns.map(c => c.metrics.cpm));
  const ctr = avg(campaigns.map(c => c.metrics.ctr));
  const sumSpend = campaigns.reduce((s, c) => s + (c.metrics.spend || 0), 0);
  const sumResults = campaigns.reduce((s, c) => s + (c.metrics.results || 0), 0);
  const cpr = sumResults > 0 ? sumSpend / sumResults : null;

  const comps = [
    { label: "CPM", value: cpm, min: BENCHMARK.cpm.min, max: BENCHMARK.cpm.max, lowerBetter: true, isPct: false },
    { label: "CTR", value: ctr, min: BENCHMARK.ctr.min, max: BENCHMARK.ctr.max, lowerBetter: false, isPct: true },
    { label: "Custo por resultado", value: cpr, min: BENCHMARK.cpl.min, max: BENCHMARK.cpl.max, lowerBetter: true, isPct: false },
  ];

  const cards = comps.map(c => {
    const status = classifyRange(c.value, c.min, c.max, c.lowerBetter);
    const cfg = { green: ["Melhor que o mercado", "green"], amber: ["Próximo do limite", "amber"], red: ["Fora do benchmark", "red"], unknown: ["Benchmark não encontrado", "slate"] }[status];
    const diff = c.value !== null ? (((c.value - (c.lowerBetter ? c.max : c.min)) / (c.lowerBetter ? c.max : c.min)) * 100) : null;
    const interpretation = c.value === null ? "Dado não disponível na resposta da API." :
      status === "green" ? "Dentro ou melhor que a faixa de benchmark de mercado." :
      status === "red" ? "Fora do benchmark — isso pode estar pressionando o custo final por resultado." :
      "Próximo do limite — vale monitorar nos próximos dias.";
    return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <b style="font-size:13px">${c.label}</b><span class="badge ${cfg[1]}"><span class="dot"></span>${cfg[0]}</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;font-size:13px;margin-bottom:10px">
        <div><div style="font-size:11px;color:var(--text-muted)">Sua conta</div><b>${c.isPct ? fmtNum(c.value,2,"%") : fmtCurrency(c.value)}</b></div>
        <div><div style="font-size:11px;color:var(--text-muted)">Benchmark</div><b>${c.isPct ? `${c.min}–${c.max}%` : `${fmtCurrency(c.min)} – ${fmtCurrency(c.max)}`}</b></div>
        <div><div style="font-size:11px;color:var(--text-muted)">Diferença</div><b>${diff !== null ? `${diff > 0 ? "+" : ""}${diff.toFixed(0)}%` : "Não disponível"}</b></div>
      </div>
      <p style="font-size:13px;color:var(--text-secondary);margin:0">${interpretation}</p>
    </div>`;
  }).join("");

  return `<h1>Benchmark — Cliente × Mercado</h1><p class="subtitle">Referência Brasil, 2026</p>${cards}`;
}

function renderAlertas() {

  const sections = Object.keys(groups).map(level => {

function renderAndromeda() {
  const { campaigns, adSets, ads } = state;
  const perCampaign = campaigns.length > 0 ? (adSets.length / campaigns.length).toFixed(1) : "0";
  const perAdSet = adSets.length > 0 ? (ads.length / adSets.length).toFixed(1) : "0";
  const saturated = adSets.filter(a => a.saturationFlag).length;
  const recs = [];
  if (Number(perCampaign) > 2) recs.push(`Consolidar ad sets: a conta tem ${perCampaign} ad sets por campanha, acima da referência de 1–2.`);
  if (ads.length < 8) recs.push(`Aumentar diversidade de criativos: apenas ${ads.length} anúncio(s) ativo(s), abaixo da referência de 8–15.`);
  if (saturated > 0) recs.push(`Resolver saturação: ${saturated} ad set(s) com frequência acima do limite saudável.`);
  if (recs.length === 0) recs.push("Estrutura já está alinhada com a referência pós-Andromeda (1 campanha → 1–2 ad sets → 8–15 criativos diversos).");

  return `<h1>Diagnóstico Andromeda</h1><p class="subtitle">Avaliação estrutural frente ao motor de entrega atual</p>
    <div class="metrics-grid">
      <div class="metric-card"><div class="label">Campanhas ativas</div><div class="value">${campaigns.length}</div></div>
      <div class="metric-card"><div class="label">Ad sets ativos</div><div class="value">${adSets.length}</div></div>
      <div class="metric-card"><div class="label">Criativos ativos</div><div class="value">${ads.length}</div></div>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px">
      <b style="font-size:13px">Referência estrutural</b>
      <p style="font-size:13px;color:var(--text-secondary)">1 campanha → 1–2 ad sets → 8–15 criativos diversos (referência, não regra absoluta).</p>
      <p style="font-size:13px"><b>Concentração de orçamento:</b> ${perCampaign} ad sets por campanha em média.</p>
      <p style="font-size:13px"><b>Diversidade de criativos:</b> ${perAdSet} criativos por ad set em média.</p>
      <p style="font-size:13px"><b>Sinais de saturação:</b> ${saturated} de ${adSets.length} ad set(s) com frequência elevada.</p>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px">
      <b style="font-size:13px">Adaptações recomendadas</b>
      <ul style="font-size:13px;color:var(--text-secondary);padding-left:18px">${recs.map(r => `<li style="margin-bottom:6px">${esc(r)}</li>`).join("")}</ul>
    </div>`;
}

function renderConfiguracoes() {
  const maskedToken = state.token
    ? state.token.slice(0, 8) + "••••••••••••••••••••" + state.token.slice(-6)
    : "Nenhum token configurado";

  setTimeout(() => {
    const saveBtn = document.getElementById("save-token-btn");
    const disconnectBtn = document.getElementById("disconnect-btn");
    const tokenInput = document.getElementById("new-token-input");

    if (saveBtn) saveBtn.onclick = async () => {
      const val = tokenInput?.value.trim();
      if (!val) return;
      saveBtn.textContent = "Salvando…";
      saveBtn.disabled = true;
      state.token = val;
      localStorage.setItem("meta_perf_token", val);
      await bootstrapAccounts();
      state.currentPage = "overview";
      render();
    };

    if (disconnectBtn) disconnectBtn.onclick = () => {
      state.token = "";
      state.accountId = "";
      state.accounts = [];
      state.campaigns = [];
      state.adSets = [];
      state.ads = [];
      state.timeSeries = [];
      localStorage.removeItem("meta_perf_token");
      localStorage.removeItem("meta_perf_account");
      state.currentPage = "overview";
      render();
    };
  }, 50);

  return `
    <h1>Configurações</h1>
    <p class="subtitle">Gerenciar token de acesso e preferências</p>

    <div style="max-width:520px;display:flex;flex-direction:column;gap:16px">

      <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:24px">
        <p style="font-size:10px;font-weight:600;color:var(--cyan-dim);letter-spacing:0.08em;text-transform:uppercase;margin:0 0 6px">Token atual</p>
        <p style="font-size:12px;color:var(--text-secondary);font-family:var(--font-mono);margin:0 0 18px;word-break:break-all">${maskedToken}</p>

        <p style="font-size:10px;font-weight:600;color:var(--cyan-dim);letter-spacing:0.08em;text-transform:uppercase;margin:0 0 6px">Novo access token</p>
        <input
          id="new-token-input"
          type="password"
          placeholder="Cole o novo token aqui (EAA...)"
          style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:var(--font-mono);background:var(--bg);color:var(--text);margin-bottom:12px"
        />
        <button id="save-token-btn" class="primary" style="width:100%">Atualizar Token</button>
        <p style="font-size:11px;color:var(--text-muted);margin:10px 0 0;line-height:1.5">
          Gere um novo token em <span style="color:var(--cyan-dim)">developers.facebook.com/tools/explorer</span> → Estender token de acesso → cole aqui. Tokens estendidos duram ~60 dias.
        </p>
      </div>

      <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:24px">
        <p style="font-size:10px;font-weight:600;color:var(--red-text);letter-spacing:0.08em;text-transform:uppercase;margin:0 0 6px">Desconectar</p>
        <p style="font-size:12px;color:var(--text-secondary);margin:0 0 14px;line-height:1.5">Remove o token salvo e desconecta todas as contas. Você precisará colar um novo token para usar o app novamente.</p>
        <button id="disconnect-btn" class="secondary" style="border-color:rgba(255,59,92,0.4);color:var(--red-text)">Desconectar</button>
      </div>

    </div>`;
}

// ---------- Bootstrap ----------

async function bootstrapAccounts() {
  state.loading = true; state.error = null; render();
  try {
    state.accounts = await fetchAccounts();
    state.loading = false;
    if (state.accountId) { await loadAccountData(); }
    else { render(); }
  } catch (err) {
    state.loading = false; state.error = err.message; render();
  }
}

async function loadAccountData() {
  if (!state.accountId) { render(); return; }
  state.loading = true; state.error = null; render();
  try {
    const bundle = await fetchBundle(state.accountId);
    state.campaigns = bundle.campaigns; state.adSets = bundle.adSets; state.ads = bundle.ads;
    state.timeSeries = bundle.timeSeries;
    state.loading = false; render();
  } catch (err) {
    state.loading = false; state.error = err.message; render();
  }
}

(async function init() {
  if (state.token) { await bootstrapAccounts(); }
  else { render(); }
})();
</script>
</body>
</html>
