<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meta Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c14;
    --surface: #0c1220;
    --surface-2: #101828;
    --border: #16324a;
    --border-bright: #1f6f8f;
    --text: #d8f3ff;
    --text-secondary: #7fa8c4;
    --text-muted: #4a6a85;
    --cyan: #22e5ff;
    --cyan-dim: #0e8fae;
    --green-bg: rgba(16,255,163,0.08); --green-text: #10ffa3; --green-dot: #10ffa3;
    --amber-bg: rgba(255,183,3,0.1); --amber-text: #ffb703; --amber-dot: #ffb703;
    --red-bg: rgba(255,59,92,0.1); --red-text: #ff3b5c; --red-dot: #ff3b5c;
    --slate-dot: #4a6a85;
    --font-display: "Chakra Petch", sans-serif;
    --font-mono: "JetBrains Mono", monospace;
  }
  * { box-sizing: border-box; }
  ::selection { background: rgba(34,229,255,0.25); color: #fff; }
  body {
    margin: 0;
    font-family: var(--font-mono);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    height: 60px; padding: 0 24px;
    background: rgba(5,8,15,0.85); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  header .brand {
    font-family: var(--font-display); font-weight: 700; font-size: 16px;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--text);
    display: flex; align-items: center; gap: 10px;
  }
  header .brand .pulse {
    width: 8px; height: 8px; border-radius: 50%; background: var(--cyan);
    box-shadow: 0 0 8px 2px rgba(34,229,255,0.8);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .header-controls { display: flex; align-items: center; gap: 10px; }

  .layout { display: flex; min-height: calc(100vh - 60px); }
  nav.sidebar {
    width: 208px; flex-shrink: 0; padding: 16px 12px;
    background: rgba(10,17,32,0.5); border-right: 1px solid var(--border);
  }
  .nav-group-label {
    font-size: 9px; font-weight: 700; color: var(--text-muted);
    letter-spacing: 0.12em; text-transform: uppercase;
    padding: 14px 12px 5px; display: block;
  }
  nav.sidebar a {
    display: block; padding: 9px 12px; margin-bottom: 2px;
    border-radius: 4px; font-size: 12px; font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-secondary); text-decoration: none; cursor: pointer;
    border-left: 2px solid transparent;
  }
  nav.sidebar a.active {
    background: rgba(34,229,255,0.07); color: var(--cyan);
    border-left: 2px solid var(--cyan);
  }
  nav.sidebar a:hover:not(.active) { background: rgba(255,255,255,0.02); color: var(--text); }
  main { flex: 1; padding: 32px; max-width: 1240px; }
  .page { display: none; }
  .page.active { display: block; }
  h1 {
    font-family: var(--font-display); font-size: 22px; font-weight: 700;
    letter-spacing: 0.03em; margin: 0 0 4px; color: var(--text);
    text-transform: uppercase;
  }
  .subtitle { font-size: 12px; color: var(--text-secondary); margin: 0 0 24px; letter-spacing: 0.02em; }

  .setup-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 32px; max-width: 460px; margin: 80px auto;
  }
  .setup-card h2 { font-family: var(--font-display); font-size: 16px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.04em; }
  .setup-card p { font-size: 12px; color: var(--text-secondary); margin: 0 0 18px; line-height: 1.6; }
  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 10px; font-weight: 600; color: var(--cyan-dim);
    margin-bottom: 6px; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .field input, select {
    width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 3px;
    font-size: 12px; font-family: var(--font-mono); background: var(--bg); color: var(--text);
  }
  .field input:focus, select:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 1px rgba(34,229,255,0.3); }
  select { cursor: pointer; }
  button.primary {
    background: var(--cyan); color: #051018; border: none; border-radius: 3px;
    padding: 10px 18px; font-size: 12px; font-weight: 700; letter-spacing: 0.05em;
    text-transform: uppercase; cursor: pointer; font-family: var(--font-display);
    box-shadow: 0 0 16px rgba(34,229,255,0.35);
  }
  button.primary:hover { box-shadow: 0 0 24px rgba(34,229,255,0.55); }
  button.secondary {
    background: transparent; color: var(--cyan); border: 1px solid var(--border-bright); border-radius: 3px;
    padding: 9px 16px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
    text-transform: uppercase; cursor: pointer; font-family: var(--font-display);
  }
  button.secondary:hover { background: rgba(34,229,255,0.06); }
  .hint { font-size: 10px; color: var(--text-muted); margin-top: 8px; letter-spacing: 0.02em; }

  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .metric-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 18px;
  }
  .metric-card .label {
    font-size: 10px; color: var(--text-secondary); margin-bottom: 8px;
    letter-spacing: 0.08em; text-transform: uppercase; font-family: var(--font-mono);
  }
  .metric-card .value {
    font-size: 22px; font-weight: 700; font-family: var(--font-display); color: var(--text);
    text-shadow: 0 0 12px rgba(34,229,255,0.15);
  }
  .metric-card .sub { font-size: 10px; color: var(--text-muted); margin-top: 6px; }

  /* ── Health Score bars ── */
  .score-bar-track {
    height: 5px; border-radius: 3px; background: rgba(255,255,255,0.06); overflow: hidden;
  }
  .score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
  .score-bar-green { background: var(--green-text); box-shadow: 0 0 6px rgba(16,255,163,0.4); }
  .score-bar-amber { background: var(--amber-text); box-shadow: 0 0 6px rgba(255,183,3,0.4); }
  .score-bar-red   { background: var(--red-text);   box-shadow: 0 0 6px rgba(255,59,92,0.4);  }

  /* ── Diagnóstico items ── */
  .diag-critical { background: var(--red-bg);   border: 1px solid rgba(255,59,92,0.2);  }
  .diag-warning  { background: var(--amber-bg); border: 1px solid rgba(255,183,3,0.2);  }
  .diag-good     { background: var(--green-bg); border: 1px solid rgba(16,255,163,0.2); }

  /* ── KPI card variants ── */
  .kpi-accent {
    border-top: 2px solid var(--cyan) !important;
  }
  .kpi-accent .label { color: var(--cyan-dim) !important; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  thead th {
    text-align: left; padding: 11px 14px; font-size: 10px; font-weight: 600; color: var(--cyan-dim);
    background: var(--surface-2); border-bottom: 1px solid var(--border); white-space: nowrap;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  tbody td { padding: 11px 14px; border-bottom: 1px solid rgba(22,50,74,0.4); white-space: nowrap; color: var(--text); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(34,229,255,0.03); }
  .table-wrap { overflow-x: auto; border-radius: 8px; position: relative; transition: box-shadow 0.15s; }
  .table-wrap.scroll-right { box-shadow: inset -24px 0 16px -20px rgba(34,229,255,0.12); }
  .table-wrap.scroll-left { box-shadow: inset 24px 0 16px -20px rgba(34,229,255,0.12); }
  .table-wrap.scroll-right.scroll-left { box-shadow: inset -24px 0 16px -20px rgba(34,229,255,0.12), inset 24px 0 16px -20px rgba(34,229,255,0.12); }
  .scroll-nudge { font-size: 10px; color: var(--text-muted); margin: 8px 2px 0; display: none; letter-spacing: 0.03em; }
  .table-wrap.scroll-right ~ .scroll-nudge { display: block; }

  .badge {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 3px;
    font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; border: 1px solid;
  }
  .badge.green { background: var(--green-bg); color: var(--green-text); border-color: rgba(16,255,163,0.3); }
  .badge.amber { background: var(--amber-bg); color: var(--amber-text); border-color: rgba(255,183,3,0.3); }
  .badge.red { background: var(--red-bg); color: var(--red-text); border-color: rgba(255,59,92,0.3); }
  .badge.slate { background: rgba(74,106,133,0.1); color: var(--text-muted); border-color: var(--border); }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; }
  .badge.green .dot { background: var(--green-dot); box-shadow: 0 0 6px var(--green-dot); }
  .badge.amber .dot { background: var(--amber-dot); box-shadow: 0 0 6px var(--amber-dot); }
  .badge.red .dot { background: var(--red-dot); box-shadow: 0 0 6px var(--red-dot); }
  .badge.slate .dot { background: var(--slate-dot); }

  .alert-card { border-radius: 8px; padding: 18px; border-left: 3px solid; margin-bottom: 10px; background: var(--surface); border-top: 1px solid var(--border); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .alert-card.critico { border-left-color: var(--red-text); box-shadow: -3px 0 16px -6px rgba(255,59,92,0.3); }
  .alert-card.importante { border-left-color: var(--amber-text); box-shadow: -3px 0 16px -6px rgba(255,183,3,0.25); }
  .alert-card.oportunidade { border-left-color: var(--green-text); box-shadow: -3px 0 16px -6px rgba(16,255,163,0.25); }
  .alert-card .level { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; font-family: var(--font-display); }
  .alert-card.critico .level { color: var(--red-text); }
  .alert-card.importante .level { color: var(--amber-text); }
  .alert-card.oportunidade .level { color: var(--green-text); }
  .alert-card .problem { font-weight: 600; font-size: 13px; margin: 8px 0; color: var(--text); }
  .alert-card dl { margin: 0; font-size: 11px; }
  .alert-card dl div { margin-bottom: 4px; color: var(--text-secondary); line-height: 1.5; }
  .alert-card dl b { color: var(--cyan-dim); font-weight: 600; }

  .empty-state { text-align: center; padding: 70px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
  .empty-state h3 { font-family: var(--font-display); font-size: 15px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text); }
  .empty-state p { font-size: 12px; color: var(--text-secondary); max-width: 380px; margin: 0 auto; line-height: 1.6; }

  .loading { text-align: center; padding: 70px; color: var(--cyan-dim); font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; }
  .loading::after { content: ""; display: inline-block; width: 10px; }
  .section { margin-bottom: 28px; }
  .section h2 {
    font-family: var(--font-display); font-size: 12px; font-weight: 600; margin: 0 0 12px;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--cyan-dim);
  }
  .flag { display: inline-block; font-size: 9px; font-weight: 600; padding: 2px 7px; border-radius: 3px; margin-right: 4px; margin-top: 5px; letter-spacing: 0.03em; text-transform: uppercase; }
  .flag.red { background: var(--red-bg); color: var(--red-text); border: 1px solid rgba(255,59,92,0.3); }
  .flag.amber { background: var(--amber-bg); color: var(--amber-text); border: 1px solid rgba(255,183,3,0.3); }

  .period-select {
    width: auto; min-width: 150px; padding: 7px 10px; font-size: 11px;
  }
  .period-custom { display: flex; gap: 6px; align-items: center; }
  .period-custom input[type="date"] { width: auto; padding: 6px 8px; font-size: 11px; }

  /* ── Criativos tab ── */
  .criativos-layout { display: flex; gap: 0; align-items: flex-start; }
  .criativos-table-area { flex: 1; min-width: 0; }
  .ad-drawer {
    width: 360px; flex-shrink: 0; margin-left: 16px;
    background: var(--surface); border: 1px solid var(--border-bright);
    border-radius: 8px; padding: 20px;
    max-height: calc(100vh - 130px); overflow-y: auto;
    position: sticky; top: 80px; animation: drawer-in 0.15s ease;
  }
  @keyframes drawer-in { from { opacity:0; transform:translateX(8px); } to { opacity:1; transform:translateX(0); } }
  .creative-score-ring {
    display: inline-flex; align-items: center; justify-content: center;
    width: 48px; height: 48px; border-radius: 50%; border: 2px solid;
    font-size: 15px; font-weight: 800; font-family: var(--font-display);
  }
  .score-mini {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 50%; border: 2px solid;
    font-size: 11px; font-weight: 800; font-family: var(--font-display); flex-shrink: 0;
  }
  .conf-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
    padding: 2px 7px; border-radius: 3px; text-transform: uppercase;
  }
  .conf-alta  { background: rgba(16,255,163,0.1);  color: var(--green-text); border: 1px solid rgba(16,255,163,0.3); }
  .conf-media { background: rgba(255,183,3,0.1);   color: var(--amber-text); border: 1px solid rgba(255,183,3,0.3); }
  .conf-baixa { background: rgba(74,106,133,0.1);  color: var(--text-muted); border: 1px solid var(--border); }
  .cls-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.07em;
    padding: 3px 9px; border-radius: 3px; text-transform: uppercase; border: 1px solid; white-space: nowrap;
  }
  .cls-vencedor    { background: rgba(16,255,163,0.1);  color: var(--green-text); border-color: rgba(16,255,163,0.35); }
  .cls-escalar     { background: rgba(34,229,255,0.1);  color: var(--cyan);       border-color: rgba(34,229,255,0.35); }
  .cls-testando    { background: rgba(74,106,133,0.1);  color: var(--text-secondary); border-color: var(--border); }
  .cls-insuficiente{ background: rgba(74,106,133,0.07); color: var(--text-muted); border-color: rgba(74,106,133,0.25); }
  .cls-saturando   { background: rgba(255,183,3,0.1);   color: var(--amber-text); border-color: rgba(255,183,3,0.35); }
  .cls-perdedor    { background: rgba(255,59,92,0.1);   color: var(--red-text);   border-color: rgba(255,59,92,0.35); }
  .cls-neutro      { background: rgba(74,106,133,0.1);  color: var(--text-secondary); border-color: var(--border); }
  tbody tr.ad-row { cursor: pointer; }
  tbody tr.ad-row.selected { background: rgba(34,229,255,0.07) !important; }
  .delta-pos { color: var(--green-text); font-size: 9px; font-weight: 700; }
  .delta-neg { color: var(--red-text);   font-size: 9px; font-weight: 700; }
  .delta-neu { color: var(--text-muted); font-size: 9px; }
  .intel-card {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px;
  }
  .intel-card .intel-title { font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--cyan-dim); margin-bottom: 10px; }
  .intel-card .intel-val   { font-size: 24px; font-weight: 800; font-family: var(--font-display); color: var(--text); }
  .intel-card .intel-sub   { font-size: 11px; color: var(--text-muted); margin-top: 4px; line-height: 1.4; }
  .drawer-section { margin-bottom: 18px; }
  .drawer-section-title { font-size: 9px; font-weight: 700; color: var(--cyan-dim); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; }
  .drawer-metric { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(22,50,74,0.35); font-size: 11px; }
  .drawer-metric:last-child { border-bottom: none; }
  .drawer-metric .dm-label { color: var(--text-muted); }
  .drawer-metric .dm-val   { color: var(--text); font-weight: 600; }
  .dna-tag { display: inline-block; font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 3px; margin: 2px; background: rgba(34,229,255,0.07); color: var(--cyan); border: 1px solid rgba(34,229,255,0.2); letter-spacing: 0.04em; }
  .fatigue-item { display: flex; align-items: flex-start; gap: 8px; padding: 8px 0; border-bottom: 1px solid rgba(22,50,74,0.3); font-size: 11px; }
  .fatigue-item:last-child { border-bottom: none; }
  .funnel-bar-track { height: 5px; border-radius: 3px; background: rgba(255,255,255,0.05); overflow: hidden; flex: 1; }
  .funnel-bar-fill  { height: 100%; border-radius: 3px; }
  .creative-thumb {
    width: 48px; height: 48px; object-fit: cover;
    border-radius: 5px; border: 1px solid var(--border);
    display: block; background: var(--surface-2);
  }
  .creative-thumb-placeholder {
    width: 48px; height: 48px; border-radius: 5px; border: 1px solid var(--border);
    background: var(--surface-2); display: flex; align-items: center; justify-content: center;
    color: var(--text-muted); font-size: 18px;
  }
  .creative-type-pill {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 3px;
    background: rgba(34,229,255,0.07); color: var(--cyan-dim); border: 1px solid rgba(34,229,255,0.15);
  }
</style>
</head>
<body>

<header>
  <span class="brand"><span class="pulse"></span>Meta Performance</span>
  <div id="header-controls"></div>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main id="main"></main>
</div>

<script>
const NAV_GROUPS = [
  { label: "PERFORMANCE", items: [
    { id: "overview",   label: "Overview" },
    { id: "campanhas",  label: "Campanhas" },
    { id: "adsets",     label: "Ad Sets" },
    { id: "criativos",  label: "Criativos" },
  ]},
  { label: "ANÁLISE", items: [
    { id: "benchmark",  label: "Benchmark" },
    { id: "alertas",    label: "Alertas" },
    { id: "andromeda",  label: "Andromeda" },
  ]},
  { label: "PLANEJAMENTO", items: [
    { id: "plano",      label: "Plano de ação" },
  ]},
  { label: "SISTEMA", items: [
    { id: "configuracoes", label: "⚙ Configurações" },
  ]},
];

const PERIOD_PRESETS = [
  { id: "7",  label: "Últimos 7 dias",  days: 7  },
  { id: "14", label: "Últimos 14 dias", days: 14 },
  { id: "30", label: "Últimos 30 dias", days: 30 },
  { id: "60", label: "Últimos 60 dias", days: 60 },
  { id: "90", label: "Últimos 90 dias", days: 90 },
  { id: "custom", label: "Período personalizado", days: null },
];

function computePeriod(presetId) {
  const preset = PERIOD_PRESETS.find(p => p.id === presetId) || PERIOD_PRESETS[2];
  if (preset.id === "custom") {
    const fallback = computePeriod("30");
    return { preset: "custom", since: state.period?.since || fallback.since, until: state.period?.until || fallback.until };
  }
  const until = new Date();
  const since = new Date();
  since.setDate(since.getDate() - preset.days);
  const fmt = d => d.toISOString().split("T")[0];
  return { preset: preset.id, since: fmt(since), until: fmt(until) };
}

const BENCHMARK = {
  cpm: { min: 15, max: 35 },
  cpl: { min: 0, max: 27.66 },
  ctr: { min: 1.42, max: 2.59 },
  cpc: { min: 1.92, max: 2.52 },
  alertFrequency: 2.5,
  minAudience: 50000,
};

const ACTION_LABELS = {
  "onsite_conversion.messaging_conversation_started_7d": "Conversas iniciadas",
  "onsite_conversion.lead_grouped": "Leads",
  "offsite_conversion.fb_pixel_lead": "Leads (pixel)",
  "lead": "Leads",
  "leadgen.other": "Leads",
  "link_click": "Cliques no link",
  "purchase": "Compras",
  "offsite_conversion.fb_pixel_purchase": "Compras (pixel)",
  "post_engagement": "Engajamentos",
};

// Ordem de prioridade: métricas de conversão > cliques > engajamento
// Evita que post_engagement (geralmente alto) sobrescreva a métrica real da campanha
const ACTION_PRIORITY = [
  "onsite_conversion.messaging_conversation_started_7d",
  "onsite_conversion.lead_grouped",
  "offsite_conversion.fb_pixel_lead",
  "lead",
  "leadgen.other",
  "purchase",
  "offsite_conversion.fb_pixel_purchase",
  "link_click",
  "post_engagement",
];

let state = {
  token: localStorage.getItem("meta_perf_token") || "",
  accountId: localStorage.getItem("meta_perf_account") || "",
  period: computePeriod("30"),
  statusScope: localStorage.getItem("meta_perf_status_scope") || "active",
  accounts: [],
  campaigns: [],
  adSets: [],
  ads: [],
  timeSeries: [],
  currentPage: "overview",
  selectedAdId: null,
  loading: false,
  error: null,
};

// ---------- Graph API helpers ----------

async function graphGet(path, params) {
  const url = new URL(`https://graph.facebook.com/v21.0${path}`);
  url.searchParams.set("access_token", state.token);
  for (const [k, v] of Object.entries(params || {})) {
    if (v !== undefined) url.searchParams.set(k, v);
  }
  const res = await fetch(url.toString());
  const json = await res.json();
  if (!res.ok || json.error) {
    throw new Error(json?.error?.message || `Erro na Graph API (${res.status})`);
  }
  return json;
}

function toNum(v) {
  if (v === undefined || v === null || v === "") return null;
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}

function primaryResult(insight) {
  // Usa ordem de prioridade para selecionar a métrica mais relevante da campanha.
  // Conversões/mensagens têm prioridade sobre cliques e engajamentos gerais —
  // evita que post_engagement (alto em campanhas de Engagement) sobrescreva a métrica real.
  const actions = insight?.actions;
  if (!actions || actions.length === 0) return { results: null, costPerResult: null, resultType: null };
  const known = actions.filter(a => ACTION_LABELS[a.action_type]);
  const candidates = known.length > 0 ? known : actions;
  // Ordena pelos índices de prioridade (menor índice = maior prioridade)
  const byPriority = [...candidates].sort((a, b) => {
    const ia = ACTION_PRIORITY.indexOf(a.action_type);
    const ib = ACTION_PRIORITY.indexOf(b.action_type);
    const pa = ia === -1 ? 999 : ia;
    const pb = ib === -1 ? 999 : ib;
    return pa - pb;
  });
  const best = byPriority[0];
  const results = toNum(best.value);
  const resultType = ACTION_LABELS[best.action_type] || best.action_type;
  const costEntry = insight?.cost_per_action_type?.find(c => c.action_type === best.action_type);
  return { results, costPerResult: costEntry ? toNum(costEntry.value) : null, resultType };
}

function normalizeMetrics(insight) {
  if (!insight) return { spend: null, impressions: null, reach: null, cpm: null, ctr: null, cpc: null, frequency: null, results: null, costPerResult: null, resultType: null };
  const { results, costPerResult, resultType } = primaryResult(insight);
  return {
    spend: toNum(insight.spend), impressions: toNum(insight.impressions), reach: toNum(insight.reach),
    cpm: toNum(insight.cpm), ctr: toNum(insight.ctr), cpc: toNum(insight.cpc), frequency: toNum(insight.frequency),
    results, costPerResult, resultType,
  };
}

function getVideoVal(arr) {
  if (!arr || !Array.isArray(arr)) return null;
  const e = arr[0];
  return e ? toNum(e.value) : null;
}

function normalizeAdMetrics(insight) {
  if (!insight) return {
    spend: null, impressions: null, reach: null, cpm: null, ctr: null, cpc: null,
    frequency: null, results: null, costPerResult: null, resultType: null,
    linkClicks: null, videoPlays: null, thruplay: null, thruplayRate: null,
    hookRate: null, watchDepth: null, cvr: null,
  };
  const base = normalizeMetrics(insight);
  const videoPlays    = getVideoVal(insight.video_play_actions);
  const thruplay      = getVideoVal(insight.video_thruplay_watched_actions);
  const p25           = getVideoVal(insight.video_p25_watched_actions);
  const p100          = getVideoVal(insight.video_p100_watched_actions);
  const linkClicks    = toNum(insight.inline_link_clicks);
  const thruplayRate  = videoPlays && thruplay  !== null ? (thruplay  / videoPlays) * 100 : null;
  const hookRate      = videoPlays && p25       !== null ? (p25       / videoPlays) * 100 : null;
  const watchDepth    = videoPlays && p100      !== null ? (p100      / videoPlays) * 100 : null;
  const cvr           = linkClicks && linkClicks > 0 && base.results !== null ? (base.results / linkClicks) * 100 : null;
  return { ...base, linkClicks, videoPlays, thruplay, thruplayRate, hookRate, watchDepth, cvr };
}

function dateRange() {
  return { since: state.period.since, until: state.period.until };
}

async function fetchAccounts() {
  const res = await graphGet("/me/adaccounts", { fields: "id,name,currency" });
  return res.data || [];
}

async function fetchBundle(accountId) {
  const { since, until } = dateRange();
  const insightFields = "spend,impressions,reach,cpm,ctr,cpc,frequency,actions,cost_per_action_type,results,cost_per_result";
  const timeRangeParam = `{'since':'${since}','until':'${until}'}`;
  const statusFilter = state.statusScope === "all"
    ? undefined
    : JSON.stringify(["ACTIVE"]);

  const adInsightFields = insightFields + ",video_thruplay_watched_actions,video_p25_watched_actions,video_p100_watched_actions,inline_link_clicks,video_play_actions";

  const [campaignsRes, adsetsRes, adsRes] = await Promise.all([
    graphGet(`/${accountId}/campaigns`, {
      fields: `id,name,objective,effective_status,daily_budget,bid_strategy,insights.time_range(${timeRangeParam}){${insightFields}}`,
      effective_status: statusFilter, limit: 200,
    }),
    graphGet(`/${accountId}/adsets`, {
      fields: `id,name,campaign_id,optimization_goal,start_time,daily_budget,effective_status,targeting,insights.time_range(${timeRangeParam}){${insightFields}}`,
      effective_status: statusFilter, limit: 200,
    }),
    graphGet(`/${accountId}/ads`, {
      fields: `id,name,adset_id,campaign_id,effective_status,creative{id,name,thumbnail_url,image_url,object_type},insights.time_range(${timeRangeParam}){${adInsightFields}}`,
      effective_status: statusFilter, limit: 200,
    }),
  ]);

  const campaignNameById = new Map((campaignsRes.data || []).map(c => [c.id, c.name]));
  const adsetNameById = new Map((adsetsRes.data || []).map(a => [a.id, a.name]));

  const campaigns = (campaignsRes.data || []).map(c => ({
    id: c.id, name: c.name, objective: c.objective || null,
    effectiveStatus: c.effective_status || null,
    dailyBudget: c.daily_budget ? toNum(c.daily_budget) / 100 : null,
    metrics: normalizeMetrics(c.insights?.data?.[0]),
  }));

  const adSets = (adsetsRes.data || []).map(a => {
    const metrics = normalizeMetrics(a.insights?.data?.[0]);
    const estimatedAudience = a.targeting?.audience_size_lower_bound ?? null;
    let daysActive = null;
    if (a.start_time) daysActive = Math.floor((Date.now() - new Date(a.start_time).getTime()) / 86400000);
    return {
      id: a.id, name: a.name, campaignId: a.campaign_id, campaignName: campaignNameById.get(a.campaign_id) || "Não disponível",
      effectiveStatus: a.effective_status || null,
      dailyBudget: a.daily_budget ? toNum(a.daily_budget) / 100 : null,
      estimatedAudience, daysActive, metrics,
      saturationFlag: (metrics.frequency || 0) > BENCHMARK.alertFrequency,
      audienceTooSmallFlag: estimatedAudience !== null ? estimatedAudience < BENCHMARK.minAudience : false,
      reviewCandidateFlag: (daysActive || 0) > 90 && (metrics.frequency || 0) > BENCHMARK.alertFrequency,
    };
  });

  const ads = (adsRes.data || []).map(a => ({
    id: a.id, name: a.name, adSetId: a.adset_id,
    adSetName: adsetNameById.get(a.adset_id) || "Não disponível",
    campaignId: a.campaign_id, campaignName: campaignNameById.get(a.campaign_id) || "Não disponível",
    effectiveStatus: a.effective_status || null,
    creativeType:    a.creative?.object_type   || null,
    thumbnailUrl:    a.creative?.thumbnail_url || a.creative?.image_url || null,
    metrics: normalizeAdMetrics(a.insights?.data?.[0]),
  }));

  let timeSeries = [];
  try {
    const tsRes = await graphGet(`/${accountId}/insights`, {
      fields: insightFields,
      time_range: timeRangeParam.replace(/'/g, '"'),
      time_increment: 1,
      limit: 500,
    });
    timeSeries = (tsRes.data || []).map(d => ({ date: d.date_start, ...normalizeMetrics(d) }));
  } catch (e) {
    timeSeries = [];
  }

  return { campaigns, adSets, ads, since, until, timeSeries };
}

// ---------- Diagnostics (client-side) ----------

function classifyRange(value, min, max, lowerIsBetter) {
  if (value === null) return "unknown";
  if (lowerIsBetter) {
    if (value <= max) return "green";
    if (value <= max * 1.3) return "amber";
    return "red";
  }
  if (value >= min) return "green";
  if (value >= min * 0.7) return "amber";
  return "red";
}

function campaignHealth(c) {
  const cpmS = classifyRange(c.metrics.cpm, BENCHMARK.cpm.min, BENCHMARK.cpm.max, true);
  const ctrS = classifyRange(c.metrics.ctr, BENCHMARK.ctr.min, BENCHMARK.ctr.max, false);
  const statuses = [cpmS, ctrS].filter(s => s !== "unknown");
  if (statuses.length === 0) return "unknown";
  if (statuses.includes("red")) return "red";
  if (statuses.includes("amber")) return "amber";
  return "green";
}

function adSetHealth(a) {
  if (a.saturationFlag || a.audienceTooSmallFlag) return "red";
  const cpmS = classifyRange(a.metrics.cpm, BENCHMARK.cpm.min, BENCHMARK.cpm.max, true);
  return cpmS;
}

function generateAlerts(campaigns, adSets, ads) {
  const alerts = [];
  adSets.forEach(a => {
    if (a.saturationFlag) {
      alerts.push({ level: "critico", problem: `O ad set "${a.name}" está com frequência ${a.metrics.frequency?.toFixed(2)}, acima do limite saudável de ${BENCHMARK.alertFrequency}.`,
        cause: "A audiência está sendo exposta ao mesmo criativo repetidamente — o público disponível já foi esgotado para o orçamento atual.",
        impact: "Isso pressiona o CPM para cima e reduz a eficiência do investimento.",
        recommendation: "Testar novos criativos e/ou ampliar a audiência." });
    }
    if (a.audienceTooSmallFlag) {
      alerts.push({ level: "critico", problem: `O ad set "${a.name}" tem audiência estimada de ${a.estimatedAudience.toLocaleString("pt-BR")}, abaixo do mínimo de ${BENCHMARK.minAudience.toLocaleString("pt-BR")}.`,
        cause: "A segmentação está restringindo demais o público disponível.",
        impact: "Com pouca gente para alcançar, a saturação chega rápido e o custo por resultado tende a subir.",
        recommendation: "Ampliar raio geográfico ou critérios de interesse." });
    }
    if (a.reviewCandidateFlag) {
      alerts.push({ level: "importante", problem: `O ad set "${a.name}" está ativo há ${a.daysActive} dias e já apresenta frequência elevada.`,
        cause: "Estruturas antigas sem renovação de criativo esgotam a audiência gradualmente sob o motor de entrega atual.",
        impact: "Performance tende a degradar progressivamente se nada for renovado.",
        recommendation: "Revisar: pausar, criar variações novas, ou consolidar a estrutura." });
    }
  });
  campaigns.forEach(c => {
    if (c.metrics.ctr !== null && c.metrics.ctr < BENCHMARK.ctr.min * 0.7) {
      alerts.push({ level: "importante", problem: `A campanha "${c.name}" tem CTR de ${c.metrics.ctr.toFixed(2)}%, bem abaixo do benchmark de ${BENCHMARK.ctr.min}–${BENCHMARK.ctr.max}%.`,
        cause: "O criativo pode não estar ressoando com a audiência ou o público está amplo demais.",
        impact: "CTR baixo geralmente eleva o CPM e reduz o volume de resultados pelo mesmo orçamento.",
        recommendation: "Testar novos ângulos de criativo e revisar a segmentação." });
    }
  });
  if (ads.length > 0 && ads.length < 5) {
    alerts.push({ level: "oportunidade", problem: `A conta está rodando apenas ${ads.length} criativo(s) ativo(s), abaixo da referência de 8–15.`,
      cause: "Poucas variações limitam a capacidade do algoritmo de encontrar o ângulo que melhor converte.",
      impact: "Maior chance de fadiga de criativo acelerada.",
      recommendation: "Produzir 5–10 variações adicionais e testar em paralelo." });
  }
  if (alerts.length === 0 && campaigns.length > 0) {
    alerts.push({ level: "oportunidade", problem: "Nenhum problema crítico identificado nos dados coletados.",
      cause: "CPM, CTR e frequência estão dentro das faixas saudáveis.",
      impact: "Conta operando de forma estável no período.",
      recommendation: "Manter monitoramento periódico e testar incrementos de criativo." });
  }
  const order = { critico: 0, importante: 1, oportunidade: 2 };
  return alerts.sort((a, b) => order[a.level] - order[b.level]);
}

function healthScore(campaigns, adSets, ads) {
  // CTR ponderado por impressões
  const avgCtr = (() => {
    const valid = campaigns.filter(c => c.metrics.ctr !== null && c.metrics.impressions > 0);
    if (!valid.length) return null;
    const totalImp = valid.reduce((s, c) => s + c.metrics.impressions, 0);
    const totalClicks = valid.reduce((s, c) => s + (c.metrics.ctr / 100) * c.metrics.impressions, 0);
    return totalImp > 0 ? (totalClicks / totalImp) * 100 : null;
  })();
  const ctrScore = avgCtr === null ? 50 : Math.min(100, Math.max(0, (avgCtr / BENCHMARK.ctr.max) * 100));

  // CPM ponderado por impressões (= totalSpend/totalImpressions*1000)
  const avgCpm = (() => {
    const totalSp = campaigns.reduce((s, c) => s + (c.metrics.spend || 0), 0);
    const totalImp = campaigns.reduce((s, c) => s + (c.metrics.impressions || 0), 0);
    return totalSp > 0 && totalImp > 0 ? (totalSp / totalImp) * 1000 : null;
  })();
  const cpmScore = avgCpm === null ? 50 : Math.min(100, Math.max(0, (1 - avgCpm / (BENCHMARK.cpm.max * 1.5)) * 100));

  // Frequência ponderada por alcance dos ad sets
  const avgFreq = (() => {
    const valid = adSets.filter(a => a.metrics.frequency !== null && a.metrics.reach > 0);
    if (!valid.length) {
      const vals = adSets.map(a => a.metrics.frequency).filter(v => v !== null);
      return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
    }
    const totalR = valid.reduce((s, a) => s + a.metrics.reach, 0);
    return valid.reduce((s, a) => s + a.metrics.frequency * (a.metrics.reach / totalR), 0);
  })();
  const freqScore = avgFreq === null ? 50 : Math.min(100, Math.max(0, (1 - avgFreq / (BENCHMARK.alertFrequency * 2)) * 100));
  const creativeScore = ads.length === 0 ? 0 : Math.min(100, (Math.min(ads.length, 15) / 15) * 100);
  const perCampaign = campaigns.length > 0 ? adSets.length / campaigns.length : 0;
  const structureScore = perCampaign === 0 ? 50 : perCampaign <= 2 ? 100 : Math.max(0, 100 - (perCampaign - 2) * 15);
  const score = Math.round(ctrScore*0.25 + cpmScore*0.25 + freqScore*0.2 + creativeScore*0.15 + structureScore*0.15);
  return { score: Math.min(100, Math.max(0, score)), ctrScore: Math.round(ctrScore), cpmScore: Math.round(cpmScore), freqScore: Math.round(freqScore), creativeScore: Math.round(creativeScore), structureScore: Math.round(structureScore) };
}

// ---------- Creative analytics helpers ----------

function adConfidence(m) {
  const spend = m.spend || 0, results = m.results || 0, impressions = m.impressions || 0;
  if (spend >= 200 && results >= 20 && impressions >= 5000) return "alta";
  if (spend >= 50  && results >= 5  && impressions >= 1000) return "media";
  return "baixa";
}

function adCreativeScore(m, avgSpend, avgCpr) {
  if (!m || m.spend === null) return null;
  let score = 0, totalWeight = 0;
  const add = (w, raw) => { score += w * Math.min(100, Math.max(0, raw)); totalWeight += w; };
  // Conversion (up to 40%)
  if (m.costPerResult !== null && avgCpr > 0) add(0.25, (avgCpr / m.costPerResult) * 50);
  if (m.results !== null)                     add(0.10, Math.log10((m.results || 0) + 1) * 50);
  if (m.cvr !== null)                         add(0.05, m.cvr * 10);
  // Attraction (up to 25%)
  if (m.ctr !== null)                         add(0.15, (m.ctr / BENCHMARK.ctr.max) * 100);
  if (m.cpm !== null)                         add(0.10, Math.max(0, (1 - m.cpm / (BENCHMARK.cpm.max * 2)) * 100));
  // Retention — video only (up to 20%)
  if (m.hookRate !== null)                    add(0.10, m.hookRate * 2);
  if (m.thruplayRate !== null)                add(0.10, m.thruplayRate * 1.5);
  // Scale (up to 15%)
  if (m.spend !== null && avgSpend > 0)       add(0.10, Math.min(100, (m.spend / avgSpend) * 50));
  if (m.reach !== null)                       add(0.05, Math.log10((m.reach || 0) + 1) * 25);
  if (totalWeight === 0) return null;
  return Math.round(Math.min(100, score / totalWeight));
}

function adClassification(m, score, conf, spendShare) {
  const spend = m.spend || 0, freq = m.frequency || 0;
  if (conf === "baixa" && spend < 20) return "INSUFICIENTE";
  if (conf === "baixa")               return "TESTANDO";
  if (freq > 3.5)                     return "SATURANDO";
  if (score !== null) {
    if (score >= 72 && conf === "alta" && spendShare >= 0.15) return "ESCALAR";
    if (score >= 60)  return "VENCEDOR";
    if (score < 35)   return "PERDEDOR";
  }
  return "NEUTRO";
}

function vsAvgHtml(val, avg, lowerBetter, suffix) {
  if (val === null || avg === null || avg === 0) return "";
  const pct = ((val - avg) / avg) * 100;
  const better = lowerBetter ? pct < 0 : pct > 0;
  const cls = Math.abs(pct) < 5 ? "delta-neu" : (better ? "delta-pos" : "delta-neg");
  const sign = pct > 0 ? "+" : "";
  return `<span class="${cls}">${sign}${pct.toFixed(0)}% vs média</span>`;
}

function classificationBadge(cls) {
  const map = {
    VENCEDOR:     ["cls-vencedor",     "✓ VENCEDOR"],
    ESCALAR:      ["cls-escalar",      "↑ ESCALAR"],
    TESTANDO:     ["cls-testando",     "◎ TESTANDO"],
    INSUFICIENTE: ["cls-insuficiente", "○ INSUFICIENTE"],
    SATURANDO:    ["cls-saturando",    "⚠ SATURANDO"],
    PERDEDOR:     ["cls-perdedor",     "↓ PERDEDOR"],
    NEUTRO:       ["cls-neutro",       "– NEUTRO"],
  };
  const [css, label] = map[cls] || ["cls-neutro", cls || "–"];
  return `<span class="cls-badge ${css}">${label}</span>`;
}

function confidenceBadge(conf) {
  const map = { alta: ["conf-alta", "ALTA"], media: ["conf-media", "MÉDIA"], baixa: ["conf-baixa", "BAIXA"] };
  const [css, label] = map[conf] || ["conf-baixa", "–"];
  return `<span class="conf-badge ${css}">${label}</span>`;
}

function creativeTypeIcon(objectType) {

    VIDEO:         "🎬",

    CAROUSEL:      "🎠",

  };
  return map[objectType] || "🖼";
}

function inferDNA(name) {
  if (!name) return [];
  const n = name.toLowerCase();
  const tags = [];
  if (n.includes("reels") || n.includes("stories") || n.includes("story")) tags.push("Stories/Reels");
  else if (n.includes("carrossel") || n.includes("carousel"))              tags.push("Carrossel");
  else if (n.includes("vídeo") || n.includes("video"))                     tags.push("Vídeo");
  else if (n.includes("imagem") || n.includes("foto") || n.includes("static")) tags.push("Imagem");
  else if (n.includes("feed"))                                              tags.push("Feed");
  if (n.includes("ugc"))                                                    tags.push("UGC");
  if (n.includes("depoimento") || n.includes("testemunho") || n.includes("cliente")) tags.push("Prova social");
  if (n.includes("problema") || n.includes(" dor "))                       tags.push("Pain point");
  if (n.includes("antes") || n.includes("depois"))                         tags.push("Antes/Depois");
  if (n.includes("oferta") || n.includes("desconto") || n.includes("promo") || n.includes("%off")) tags.push("Oferta");
  if (n.includes("urgên") || n.includes("limitad") || n.includes("hoje"))  tags.push("Urgência");
  if (n.includes("benefício") || n.includes("vantagem"))                   tags.push("Benefício");
  const vMatch = n.match(/v(\d+)/); if (vMatch) tags.push(`V${vMatch[1]}`);
  const abMatch = n.match(/\s([a-d])\s|\s([a-d])$/); if (abMatch) tags.push(`Var. ${(abMatch[1]||abMatch[2]).toUpperCase()}`);
  return tags.slice(0, 6);
}

function creativeIntelligence(rankedAds, avgCtr, avgCpm, avgCpr) {

  return `

        </div>
        <div class="intel-card">
          <div class="intel-title">Em Teste</div>
          <div class="intel-val" style="color:var(--text-muted)">${testing}</div>
          <div class="intel-sub">amostra insuficiente ou observação inicial</div>
        </div>
        <div class="intel-card">
          <div class="intel-title">Perdedores</div>
          <div class="intel-val" style="color:${losers > 0 ? "var(--red-text)" : "var(--text-muted)"}">${losers}</div>
          <div class="intel-sub">${losers > 0 ? "candidatos a pausar ou renovar" : "nenhum criativo perdedor"}</div>
        </div>
        <div class="intel-card">
          <div class="intel-title">Score Médio</div>
          <div class="intel-val" style="color:${avgScore !== null ? scoreColor(avgScore) : "var(--text-muted)"}">${avgScore ?? "–"}</div>
          <div class="intel-sub">qualidade média do portfólio de criativos</div>
        </div>
        ${best ? `<div class="intel-card" style="border-color:rgba(16,255,163,0.25)">
          <div class="intel-title">🏆 Melhor criativo</div>
          <div style="font-size:11px;font-weight:700;color:var(--text);line-height:1.3;margin-bottom:6px">${esc(best.name)}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <span style="font-size:10px;color:var(--cyan)">Score ${best.score}</span>
            ${best.metrics.costPerResult !== null ? `<span style="font-size:10px;color:var(--text-muted)">CPA ${fmtCurrency(best.metrics.costPerResult)}</span>` : ""}
          </div>
        </div>` : ""}
        ${worst ? `<div class="intel-card" style="border-color:rgba(255,59,92,0.2)">
          <div class="intel-title">🔻 Candidato a pausar</div>
          <div style="font-size:11px;font-weight:700;color:var(--text);line-height:1.3;margin-bottom:6px">${esc(worst.name)}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            ${worst.score !== null ? `<span style="font-size:10px;color:var(--red-text)">Score ${worst.score}</span>` : ""}
            ${worst.metrics.costPerResult !== null ? `<span style="font-size:10px;color:var(--text-muted)">CPA ${fmtCurrency(worst.metrics.costPerResult)}</span>` : ""}
          </div>
        </div>` : ""}
      </div>
    </div>`;
}

// ---------- Score helpers ----------

function scoreColor(s) {
  if (s >= 70) return "var(--green-text)";
  if (s >= 40) return "var(--amber-text)";
  return "var(--red-text)";
}
function scoreBg(s) {
  if (s >= 70) return "var(--green-bg)";
  if (s >= 40) return "var(--amber-bg)";
  return "var(--red-bg)";
}
function scoreBarClass(s) {
  if (s >= 70) return "score-bar-green";
  if (s >= 40) return "score-bar-amber";
  return "score-bar-red";
}
function overallLabel(s) {
  if (s >= 80) return "EXCELENTE";
  if (s >= 60) return "BOM";
  if (s >= 40) return "ATENÇÃO NECESSÁRIA";
  return "CRÍTICO";
}
function diagMessage(key, score) {
  const map = {
    CTR:        ["CTR criticamente baixo. Revisar criativos e segmentação.",              "CTR abaixo do ideal. Testar novos formatos de anúncio.",         "CTR em bom nível. Manter a segmentação atual."],
    CPM:        ["CPM elevado. Audiência muito competitiva ou saturada.",                 "CPM aceitável. Monitorar evolução semanal.",                      "CPM eficiente. Boa relação com a audiência."],
    Frequência: ["Frequência alta. Risco elevado de fadiga de anúncio.",                 "Frequência em zona de atenção. Renovar criativos em breve.",     "Frequência saudável. Sem risco de saturação."],
    Criativos:  ["Diversidade de criativos crítica. Adicionar novos formatos urgente.",  "Poucos criativos ativos. Ampliar variedade de anúncios.",        "Boa diversidade de criativos. Seguir testando."],
    Estrutura:  ["Estrutura de conta com problemas. Revisar organização das campanhas.", "Estrutura pode ser otimizada.",                                  "Estrutura de conta organizada e saudável."],
  };
  const msgs = map[key] || ["", "", ""];
  return score < 40 ? msgs[0] : score < 70 ? msgs[1] : msgs[2];
}

// ---------- Gráfico de evolução (SVG puro, sem dependências) ----------

function buildLineChart(series, config) {
  const { key, label, color, isCurrency } = config;
  const width = 560, height = 220, padding = { top: 28, right: 16, bottom: 22, left: 52 };
  const points = series.map(d => ({ date: d.date, value: d[key] }));
  const values = points.map(p => p.value).filter(v => v !== null && v !== undefined);

  if (values.length === 0) {
    return `<div style="padding:24px;text-align:center;color:var(--text-muted);font-size:12px;border:1px dashed var(--border);border-radius:10px">Sem dados de "${label}" disponíveis para o período.</div>`;
  }

  const maxV = Math.max(...values, 0.0001);
  const minV = Math.min(...values, 0);
  const range = maxV - minV || 1;
  const innerW = width - padding.left - padding.right;
  const innerH = height - padding.top - padding.bottom;

  const coords = points.map((p, i) => {
    const x = padding.left + (i / Math.max(points.length - 1, 1)) * innerW;
    const y = p.value === null ? null : padding.top + innerH - ((p.value - minV) / range) * innerH;
    return { x, y, date: p.date, value: p.value, idx: i };
  });

  const validCoords = coords.filter(c => c.y !== null);
  const pathD = validCoords.map((c, i) => `${i === 0 ? "M" : "L"} ${c.x.toFixed(1)} ${c.y.toFixed(1)}`).join(" ");
  const areaD = validCoords.length > 0
    ? `${pathD} L ${validCoords[validCoords.length - 1].x.toFixed(1)} ${(padding.top + innerH).toFixed(1)} L ${validCoords[0].x.toFixed(1)} ${(padding.top + innerH).toFixed(1)} Z`
    : "";

  // Label step: show value labels at regular intervals to avoid overcrowding
  const labelStep = Math.max(1, Math.floor(points.length / 8));
  const maxIdx = validCoords.reduce((a, b) => b.value > a.value ? b : a, validCoords[0]).idx;
  const lastIdx = validCoords[validCoords.length - 1].idx;

  const formatVal = v => isCurrency
    ? (v >= 1000 ? `R$${(v/1000).toFixed(1)}k` : `R$${v.toFixed(2)}`)
    : fmtNum(v, v % 1 === 0 ? 0 : 2);

  const dots = validCoords.map(c => {
    const showLabel = c.idx % labelStep === 0 || c.idx === lastIdx || c.idx === maxIdx;
    const labelY = c.y - 9;
    const anchor = c.x < padding.left + 30 ? "start" : c.x > width - padding.right - 30 ? "end" : "middle";
    return `
      <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="2.5" fill="${color}">
        <title>${c.date}: ${isCurrency ? fmtCurrency(c.value) : fmtNum(c.value, 2)}</title>
      </circle>
      ${showLabel ? `<text x="${c.x.toFixed(1)}" y="${labelY.toFixed(1)}" text-anchor="${anchor}" font-size="8.5" font-family="monospace" font-weight="600" fill="${color}" opacity="0.92">${formatVal(c.value)}</text>` : ""}`;
  }).join("");

  const firstLabel = points[0]?.date ? points[0].date.slice(5) : "";
  const lastLabel = points[points.length - 1]?.date ? points[points.length - 1].date.slice(5) : "";

  return `
    <svg viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;overflow:visible">
      <line x1="${padding.left}" y1="${padding.top}" x2="${padding.left}" y2="${padding.top + innerH}" stroke="var(--border)" stroke-width="1" />
      <line x1="${padding.left}" y1="${padding.top + innerH}" x2="${width - padding.right}" y2="${padding.top + innerH}" stroke="var(--border)" stroke-width="1" />
      <text x="${padding.left - 6}" y="${padding.top + 4}" text-anchor="end" font-size="9" fill="var(--text-muted)">${isCurrency ? fmtCurrency(maxV) : fmtNum(maxV)}</text>
      <text x="${padding.left - 6}" y="${padding.top + innerH}" text-anchor="end" font-size="9" fill="var(--text-muted)">${isCurrency ? fmtCurrency(minV) : fmtNum(minV)}</text>
      <text x="${padding.left}" y="${height - 4}" font-size="9" fill="var(--text-muted)">${firstLabel}</text>
      <text x="${width - padding.right}" y="${height - 4}" text-anchor="end" font-size="9" fill="var(--text-muted)">${lastLabel}</text>
      <path d="${areaD}" fill="${color}" opacity="0.08" />
      <path d="${pathD}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
      ${dots}
    </svg>`;
}

function renderEvolutionCharts() {
  const series = state.timeSeries;
  if (!series || series.length === 0) {

function rankAds(ads) {
  const withData = ads.filter(a => a.metrics.costPerResult !== null);
  const withoutData = ads.filter(a => a.metrics.costPerResult === null);
  const sorted = [...withData].sort((a, b) => {
    const cost = (a.metrics.costPerResult ?? Infinity) - (b.metrics.costPerResult ?? Infinity);
    if (cost !== 0) return cost;
    return (b.metrics.ctr ?? 0) - (a.metrics.ctr ?? 0);
  });
  const ranked = sorted.map((ad, i) => {
    const rank = i + 1;
    const cls = rank <= Math.ceil(sorted.length * 0.3) ? "vencedor" : rank > Math.floor(sorted.length * 0.7) ? "perdedor" : "neutro";
    return { ...ad, rank, cls };
  });
  return [...ranked, ...withoutData.map(a => ({ ...a, rank: null, cls: "unknown" }))];
}

// ---------- Formatting ----------

function fmtCurrency(v) { return v === null || v === undefined ? "Não disponível" : v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
function fmtNum(v, decimals = 0, suffix = "") { return v === null || v === undefined ? "Não disponível" : v.toLocaleString("pt-BR", { minimumFractionDigits: decimals, maximumFractionDigits: decimals }) + suffix; }
function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

function badgeHtml(status) {
  const cfg = { green: ["Saudável", "green"], amber: ["Atenção", "amber"], red: ["Crítico", "red"], unknown: ["Sem dados", "slate"] }[status] || ["Sem dados", "slate"];
  return `<span class="badge ${cfg[1]}"><span class="dot"></span>${cfg[0]}</span>`;
}

const EFFECTIVE_STATUS_LABELS = {
  ACTIVE: ["Ativa", "green"], PAUSED: ["Pausada", "slate"], CAMPAIGN_PAUSED: ["Pausada (campanha)", "slate"],
  ADSET_PAUSED: ["Pausada (ad set)", "slate"], ARCHIVED: ["Arquivada", "slate"], DELETED: ["Excluída", "slate"],
  PENDING_REVIEW: ["Em revisão", "amber"], DISAPPROVED: ["Reprovada", "red"], PREAPPROVED: ["Pré-aprovada", "amber"],
  PENDING_BILLING_INFO: ["Pendente de pagamento", "amber"], IN_PROCESS: ["Em processamento", "amber"],
  WITH_ISSUES: ["Com problemas", "red"],
};

function statusBadgeHtml(effectiveStatus) {
  if (!effectiveStatus) return `<span class="badge slate"><span class="dot"></span>Não disponível</span>`;
  const cfg = EFFECTIVE_STATUS_LABELS[effectiveStatus] || [effectiveStatus, "slate"];
  return `<span class="badge ${cfg[1]}"><span class="dot"></span>${cfg[0]}</span>`;
}

// ---------- Render ----------

function render() {
  renderHeader();
  renderSidebar();
  renderMain();
}

function renderHeader() {
  const el = document.getElementById("header-controls");
  if (!state.token) { el.innerHTML = ""; return; }
  const opts = state.accounts.map(a => `<option value="${a.id}" ${a.id === state.accountId ? "selected" : ""}>${esc(a.name || a.id)}</option>`).join("");

  const periodOpts = PERIOD_PRESETS.map(p =>
    `<option value="${p.id}" ${state.period.preset === p.id ? "selected" : ""}>${p.label}</option>`
  ).join("");

  const customRange = state.period.preset === "custom"
    ? `<div class="period-custom">
        <input type="date" id="since-input" value="${state.period.since}" />
        <span style="color:var(--text-muted);font-size:11px">até</span>
        <input type="date" id="until-input" value="${state.period.until}" />
        <button class="secondary" id="apply-custom-range" style="padding:6px 10px">Aplicar</button>
      </div>`
    : "";

  el.innerHTML = `
    <div class="header-controls">
      <select id="status-scope-select" class="period-select" style="min-width:170px">
        <option value="active" ${state.statusScope === "active" ? "selected" : ""}>Apenas ativas</option>
        <option value="all" ${state.statusScope === "all" ? "selected" : ""}>Todas (inclui pausadas)</option>
      </select>
      <select id="period-select" class="period-select">${periodOpts}</select>
      ${customRange}
      <select id="account-select" style="width:220px">${opts || '<option value="">Nenhuma conta</option>'}</select>
    </div>`;

  const statusSel = document.getElementById("status-scope-select");
  if (statusSel) statusSel.onchange = (e) => {
    state.statusScope = e.target.value;
    localStorage.setItem("meta_perf_status_scope", state.statusScope);
    loadAccountData();
  };

  const sel = document.getElementById("account-select");
  if (sel) sel.onchange = (e) => { state.accountId = e.target.value; localStorage.setItem("meta_perf_account", state.accountId); loadAccountData(); };

  const periodSel = document.getElementById("period-select");
  if (periodSel) periodSel.onchange = (e) => {
    const preset = e.target.value;
    state.period = computePeriod(preset);
    render();
    if (preset !== "custom") loadAccountData();
  };

  const applyBtn = document.getElementById("apply-custom-range");
  if (applyBtn) applyBtn.onclick = () => {
    const since = document.getElementById("since-input").value;
    const until = document.getElementById("until-input").value;
    if (since && until) {
      state.period = { preset: "custom", since, until };
      loadAccountData();
    }
  };
}

function renderSidebar() {
  const el = document.getElementById("sidebar");
  if (!state.token) { el.innerHTML = ""; return; }
  el.innerHTML = NAV_GROUPS.map(group => `
    <span class="nav-group-label">${group.label}</span>
    ${group.items.map(item =>
      `<a class="${state.currentPage === item.id ? "active" : ""}" data-page="${item.id}">${item.label}</a>`
    ).join("")}
  `).join("");
  el.querySelectorAll("a").forEach(a => a.onclick = () => { state.currentPage = a.dataset.page; render(); });
}

function renderMain() {
  const el = document.getElementById("main");

  if (!state.token) {
    el.innerHTML = `
      <div class="setup-card">
        <h2>Conectar Meta Performance</h2>
        <p>Cole seu access token da Meta Graph API (gerado no Graph API Explorer, com permissão ads_read). Ele fica salvo só no seu navegador — nunca é enviado a nenhum servidor além da própria Meta.</p>
        <div class="field"><label>Access token</label><input id="token-input" type="password" placeholder="EAA..." /></div>
        <button class="primary" id="connect-btn">Conectar</button>
        <p class="hint">Gere em developers.facebook.com/tools/explorer</p>
      </div>`;
    document.getElementById("connect-btn").onclick = async () => {
      const val = document.getElementById("token-input").value.trim();
      if (!val) return;
      state.token = val;
      localStorage.setItem("meta_perf_token", val);
      await bootstrapAccounts();
    };
    return;
  }

  // Configurações sempre acessível, independente de token ou erro
  if (state.currentPage === "configuracoes") {
    el.innerHTML = renderConfiguracoes();
    return;
  }

  if (state.loading) { el.innerHTML = `<div class="loading">Carregando dados da conta…</div>`; return; }

  if (state.error) {
    el.innerHTML = `<div class="empty-state"><h3>Erro ao consultar a Meta Marketing API</h3><p>${esc(state.error)}</p><div style="display:flex;gap:10px;justify-content:center;margin-top:16px"><button class="secondary" id="retry-btn">Tentar de novo</button><button class="primary" id="go-config-btn">Atualizar Token</button></div></div>`;
    document.getElementById("retry-btn").onclick = () => loadAccountData();
    document.getElementById("go-config-btn").onclick = () => { state.currentPage = "configuracoes"; render(); };
    return;
  }

  if (!state.accountId) {
    el.innerHTML = `<div class="empty-state"><h3>Nenhuma conta selecionada</h3><p>Selecione uma conta no seletor no topo da página.</p></div>`;
    return;
  }

  const pages = {
    overview: renderOverview, campanhas: renderCampanhas, adsets: renderAdSets,
    criativos: renderCriativos, benchmark: renderBenchmark, alertas: renderAlertas,
    andromeda: renderAndromeda, plano: renderPlano, configuracoes: renderConfiguracoes,
  };
  el.innerHTML = (pages[state.currentPage] || renderOverview)();
  setupTableScrollHints();
}

function setupTableScrollHints() {
  document.querySelectorAll(".table-wrap").forEach(wrap => {
    const update = () => {
      const scrollable = wrap.scrollWidth > wrap.clientWidth + 1;
      wrap.classList.toggle("scroll-right", scrollable && wrap.scrollLeft < wrap.scrollWidth - wrap.clientWidth - 1);
      wrap.classList.toggle("scroll-left", wrap.scrollLeft > 1);
    };
    update();
    wrap.addEventListener("scroll", update);
    window.addEventListener("resize", update);
  });
}

// ---------- renderOverview — redesigned ----------

function renderOverview() {
  const { campaigns, adSets, ads } = state;
  const sum = arr => arr.some(v => v !== null) ? arr.reduce((a, v) => a + (v || 0), 0) : null;
  const avg = arr => { const v = arr.filter(x => x !== null); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; };

  const totalSpend       = sum(campaigns.map(c => c.metrics.spend));
  const totalResults     = sum(campaigns.map(c => c.metrics.results));
  // Orçamento: usa ad sets como fonte de verdade quando há orçamento a nível de ad set.
  // Meta pode retornar daily_budget agregado/estimado na campanha que não bate com o Ads Manager.
  const adSetBudgetTotal = sum(adSets.map(a => a.dailyBudget));
  const campaignBudgetTotal = sum(campaigns.map(c => c.dailyBudget));
  const dailyBudget = adSetBudgetTotal !== null ? adSetBudgetTotal : campaignBudgetTotal;
  const reach            = sum(campaigns.map(c => c.metrics.reach));
  const totalImpressions = sum(campaigns.map(c => c.metrics.impressions));

  // CPM: gasto total / impressões totais × 1000 (igual ao Ads Manager)
  const cpm = totalSpend !== null && totalImpressions ? (totalSpend / totalImpressions) * 1000 : null;

  // CTR: média ponderada por impressões (cliques estimados / impressões totais × 100)
  const ctr = (() => {
    const valid = campaigns.filter(c => c.metrics.ctr !== null && c.metrics.impressions !== null && c.metrics.impressions > 0);
    if (!valid.length) return null;
    const totalImp = valid.reduce((s, c) => s + c.metrics.impressions, 0);
    const totalClicks = valid.reduce((s, c) => s + (c.metrics.ctr / 100) * c.metrics.impressions, 0);
    return totalImp > 0 ? (totalClicks / totalImp) * 100 : null;
  })();

  // CPC: gasto total / cliques totais estimados (igual ao Ads Manager)
  const cpc = (() => {
    const valid = campaigns.filter(c => c.metrics.cpc !== null && c.metrics.spend !== null && c.metrics.cpc > 0);
    if (!valid.length) return null;
    // cliques estimados por campanha = spend / cpc
    const totalClicks = valid.reduce((s, c) => s + (c.metrics.spend / c.metrics.cpc), 0);
    const totalSp = valid.reduce((s, c) => s + c.metrics.spend, 0);
    return totalClicks > 0 ? totalSp / totalClicks : null;
  })();

  // Frequência: média ponderada por alcance dos ad sets
  const frequency = (() => {
    const valid = adSets.filter(a => a.metrics.frequency !== null && a.metrics.reach !== null && a.metrics.reach > 0);
    if (!valid.length) return avg(adSets.map(a => a.metrics.frequency));
    const totalReach = valid.reduce((s, a) => s + a.metrics.reach, 0);
    return valid.reduce((s, a) => s + a.metrics.frequency * (a.metrics.reach / totalReach), 0);
  })();
  // Usa cost_per_action_type da API (média ponderada por resultados), igual ao Ads Manager.
  // Fallback para totalSpend/totalResults apenas se a API não retornar o campo.
  const cprFromApi = (() => {
    const valid = campaigns.filter(c => c.metrics.costPerResult !== null && c.metrics.results > 0);
    if (!valid.length) return null;
    const totalR = valid.reduce((s, c) => s + c.metrics.results, 0);
    return valid.reduce((s, c) => s + c.metrics.costPerResult * (c.metrics.results / totalR), 0);
  })();
  const cpr = cprFromApi !== null ? cprFromApi : (totalSpend !== null && totalResults ? totalSpend / totalResults : null);
  const hs            = healthScore(campaigns, adSets, ads);

  const overColor = scoreColor(hs.score);
  const overLabel = overallLabel(hs.score);

  // Score bars rows
  const scoreRows = [
    { label: "CTR",        score: hs.ctrScore       },
    { label: "CPM",        score: hs.cpmScore        },
    { label: "Frequência", score: hs.freqScore       },
    { label: "Criativos",  score: hs.creativeScore   },
    { label: "Estrutura",  score: hs.structureScore  },
  ];

  const barsHtml = scoreRows.map(({ label, score }) => `
    <div style="display:flex;align-items:center;gap:12px">
      <span style="font-size:10px;color:var(--text-muted);letter-spacing:0.08em;width:72px;flex-shrink:0;text-transform:uppercase">${label}</span>
      <div class="score-bar-track" style="flex:1">
        <div class="score-bar-fill ${scoreBarClass(score)}" style="width:${score}%"></div>
      </div>
      <span style="font-size:12px;font-weight:700;color:${scoreColor(score)};width:32px;text-align:right;flex-shrink:0">${score}</span>
    </div>`).join("");

  // Diagnóstico — sorted worst to best
  const diagEntries = [...scoreRows].sort((a, b) => a.score - b.score);
  const diagHtml = diagEntries.map(({ label, score }) => {
    const cls = score < 40 ? "diag-critical" : score < 70 ? "diag-warning" : "diag-good";
    const txtColor = score < 40 ? "var(--red-text)" : score < 70 ? "var(--amber-text)" : "var(--green-text)";
    const tagBg    = score < 40 ? "var(--red-bg)"   : score < 70 ? "var(--amber-bg)"   : "var(--green-bg)";
    const tagLabel = score < 40 ? "CRÍTICO"          : score < 70 ? "ATENÇÃO"           : "SAUDÁVEL";
    return `
      <div class="${cls}" style="border-radius:6px;padding:14px 16px;display:flex;align-items:center;gap:16px">
        <div style="flex:1">
          <span style="font-size:13px;font-weight:700;color:var(--text)">${label}</span>

function renderCampanhas() {

  // Mapa: campaignId → soma dos orçamentos dos ad sets (fonte mais precisa quando budget está no ad set)
  const adSetBudgetByCampaign = new Map();
  adSets.forEach(a => {
    if (a.dailyBudget !== null) {

      <td>${fmtNum(c.metrics.results)}</td>
      <td>${fmtCurrency(c.metrics.costPerResult)}</td>

function renderCriativos() {
  const ads = state.ads;
  const scopeLabel = state.statusScope === "all" ? "todos os anúncios (incluindo pausados)" : "anúncios ativos";
  if (ads.length === 0) return `<h1>Ranking de criativos</h1><div class="empty-state"><h3>Nenhum anúncio encontrado</h3><p>Não há anúncios para o escopo "${scopeLabel}" nesta conta e período.</p></div>`;

  // Compute averages (ponderados por impressões/resultados — igual ao Ads Manager)
  const validM  = ads.filter(a => a.metrics.spend !== null);
  const arr2avg = arr => { const v = arr.filter(x => x !== null); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; };
  const avgSpend   = arr2avg(validM.map(a => a.metrics.spend));
  const totalSpend = validM.reduce((s,a) => s + (a.metrics.spend || 0), 0);

  // CPR ponderado por resultados
  const avgCpr = (() => {
    const v = validM.filter(a => a.metrics.costPerResult !== null && a.metrics.results > 0);
    if (!v.length) return arr2avg(validM.filter(a => a.metrics.costPerResult !== null).map(a => a.metrics.costPerResult));
    const totalR = v.reduce((s,a) => s + a.metrics.results, 0);
    return v.reduce((s,a) => s + a.metrics.costPerResult * (a.metrics.results / totalR), 0);
  })();

  // CTR ponderado por impressões
  const avgCtr = (() => {
    const v = validM.filter(a => a.metrics.ctr !== null && a.metrics.impressions > 0);
    if (!v.length) return null;
    const totalImp = v.reduce((s,a) => s + a.metrics.impressions, 0);
    const totalClicks = v.reduce((s,a) => s + (a.metrics.ctr / 100) * a.metrics.impressions, 0);
    return totalImp > 0 ? (totalClicks / totalImp) * 100 : null;
  })();

  // CPM ponderado por impressões
  const avgCpm = (() => {
    const v = validM.filter(a => a.metrics.impressions > 0 && a.metrics.spend !== null);
    if (!v.length) return null;
    const totalSp = v.reduce((s,a) => s + a.metrics.spend, 0);
    const totalImp = v.reduce((s,a) => s + a.metrics.impressions, 0);
    return totalImp > 0 ? (totalSp / totalImp) * 1000 : null;
  })();

  // Score and classify
  const scoredAds = ads.map(a => {
    const m = a.metrics;
    const score       = adCreativeScore(m, avgSpend || 0, avgCpr || 0);
    const conf        = adConfidence(m);
    const spendShare  = totalSpend > 0 ? (m.spend || 0) / totalSpend : 0;
    const cls         = adClassification(m, score, conf, spendShare);
    return { ...a, score, conf, cls };
  });

  // Sort: score desc → spend desc → nulls last
  scoredAds.sort((a, b) => {
    if (a.score !== null && b.score !== null) return b.score - a.score;
    if (a.score !== null) return -1;
    if (b.score !== null) return  1;
    return (b.metrics.spend || 0) - (a.metrics.spend || 0);
  });
  const rankedAds = scoredAds.map((a, i) => ({ ...a, rank: i + 1 }));

  const selectedId  = state.selectedAdId;
  const selectedAd  = rankedAds.find(a => a.id === selectedId);

  const rows = rankedAds.map(a => {
    const m = a.metrics;
    const isSelected = a.id === selectedId;
    const scoreHtml = a.score !== null
      ? `<span class="score-mini" style="color:${scoreColor(a.score)};border-color:${scoreColor(a.score)};background:${scoreBg(a.score)}">${a.score}</span>`
      : `<span style="color:var(--text-muted);font-size:11px">–</span>`;
    const cprDelta = vsAvgHtml(m.costPerResult, avgCpr, true,  "");
    const ctrDelta = vsAvgHtml(m.ctr,           avgCtr, false, "");
    const thumbHtml = a.thumbnailUrl
      ? `<img class="creative-thumb" src="${a.thumbnailUrl}" alt="" loading="lazy" onerror="this.outerHTML='<div class=\\'creative-thumb-placeholder\\'>${creativeTypeIcon(a.creativeType)}</div>'" />`
      : `<div class="creative-thumb-placeholder">${creativeTypeIcon(a.creativeType)}</div>`;
    return `
      <tr class="ad-row${isSelected ? " selected" : ""}" onclick="window._selectAd('${a.id}')">
        <td style="color:var(--text-muted);font-weight:600;font-size:11px">${a.rank}</td>
        <td style="padding:8px 10px">${thumbHtml}</td>
        <td style="font-weight:500;max-width:200px;white-space:normal;line-height:1.35;font-size:11px">${esc(a.name)}</td>
        <td>${statusBadgeHtml(a.effectiveStatus)}</td>
        <td style="max-width:150px;white-space:normal;line-height:1.3;font-size:11px;color:var(--text-secondary)">${esc(a.campaignName)}</td>
        <td>${fmtCurrency(m.spend)}</td>
        <td>${fmtNum(m.impressions)}</td>
        <td>${fmtNum(m.results)}</td>
        <td>${fmtCurrency(m.costPerResult)}<br>${cprDelta}</td>
        <td>${fmtCurrency(m.cpm)}</td>
        <td>${fmtNum(m.ctr, 2, "%")}<br>${ctrDelta}</td>
        <td>${fmtCurrency(m.cpc)}</td>
        <td style="color:${m.cvr !== null ? "var(--text)" : "var(--text-muted)"}">${m.cvr !== null ? fmtNum(m.cvr, 1, "%") : "–"}</td>
        <td>${fmtNum(m.frequency, 2)}</td>
        <td style="text-align:center">${scoreHtml}</td>
        <td>${classificationBadge(a.cls)}</td>
        <td>${confidenceBadge(a.conf)}</td>
      </tr>`;
  }).join("");

  const drawerHtml = selectedAd ? renderAdDrawer(selectedAd) : "";

  return `
    <h1>Ranking de criativos</h1>
    <p class="subtitle">${rankedAds.length} anúncio(s) · ordenado por Creative Score · escopo: ${scopeLabel}</p>

    ${creativeIntelligence(rankedAds, avgCtr, avgCpm, avgCpr)}

    <div class="criativos-layout">
      <div class="criativos-table-area">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th><th style="width:58px">Preview</th><th>Anúncio</th><th>Status</th><th>Campanha</th>
                <th>Investimento</th><th>Impressões</th><th>Resultados</th>
                <th>Custo/Result.</th><th>CPM</th><th>CTR</th><th>CPC</th>
                <th>CVR</th><th>Frequência</th><th style="text-align:center">Score</th>
                <th>Classificação</th><th>Confiança</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <p class="scroll-nudge">→ role para o lado para ver mais colunas · clique em uma linha para o diagnóstico</p>
      </div>
      ${drawerHtml ? `<div class="ad-drawer" id="ad-drawer">${drawerHtml}</div>` : ""}
    </div>`;
}

function renderAdDrawer(ad) {
  if (!ad) return "";
  const m = ad.metrics;

  // Fatigue signals
  const fatigueSignals = [];
  if (m.frequency !== null && m.frequency > 3.5)
    fatigueSignals.push({ lvl: "red",   txt: `Frequência ${fmtNum(m.frequency, 2)} — acima do limite saudável (3.5). Risco alto de fadiga.` });
  else if (m.frequency !== null && m.frequency > 2.5)
    fatigueSignals.push({ lvl: "amber", txt: `Frequência ${fmtNum(m.frequency, 2)} — zona de atenção. Monitorar.` });
  if (m.ctr !== null && m.ctr < BENCHMARK.ctr.min * 0.7)
    fatigueSignals.push({ lvl: "red",   txt: `CTR ${fmtNum(m.ctr, 2, "%")} — muito abaixo do benchmark (${BENCHMARK.ctr.min}%). Criativo pode estar cansado.` });
  else if (m.ctr !== null && m.ctr < BENCHMARK.ctr.min)
    fatigueSignals.push({ lvl: "amber", txt: `CTR ${fmtNum(m.ctr, 2, "%")} — abaixo do benchmark de ${BENCHMARK.ctr.min}%.` });
  if (m.cpm !== null && m.cpm > BENCHMARK.cpm.max * 1.3)
    fatigueSignals.push({ lvl: "red",   txt: `CPM ${fmtCurrency(m.cpm)} — elevado. Possível saturação de audiência.` });

  // DNA tags
  const dnaTags = inferDNA(ad.name);

  // Score ring
  const scoreRing = ad.score !== null
    ? `<div class="creative-score-ring" style="color:${scoreColor(ad.score)};border-color:${scoreColor(ad.score)};background:${scoreBg(ad.score)}">${ad.score}</div>`
    : `<div class="creative-score-ring" style="color:var(--text-muted);border-color:var(--border)">–</div>`;

  // Creative preview image
  const previewHtml = ad.thumbnailUrl ? `
    <div style="position:relative;margin-bottom:16px;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:var(--surface-2)">
      <img src="${ad.thumbnailUrl}" alt="${esc(ad.name)}" loading="lazy"
        style="width:100%;max-height:220px;object-fit:cover;display:block"
        onerror="this.parentElement.innerHTML='<div style=\\'height:80px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:13px\\'>Preview não disponível</div>'" />
      ${ad.creativeType ? `<span class="creative-type-pill" style="position:absolute;bottom:8px;right:8px">${creativeTypeIcon(ad.creativeType)} ${ad.creativeType}</span>` : ""}
    </div>` : "";

  // Header
  const headerHtml = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">
      <div style="flex:1;min-width:0">
        <div style="font-size:9px;font-weight:700;letter-spacing:0.12em;color:var(--cyan-dim);text-transform:uppercase;margin-bottom:4px">Diagnóstico do criativo</div>
        <div style="font-size:12px;font-weight:700;color:var(--text);line-height:1.3;word-break:break-word">${esc(ad.name)}</div>
        <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
          ${classificationBadge(ad.cls)}
          ${confidenceBadge(ad.conf)}
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;margin-left:14px;flex-shrink:0">
        ${scoreRing}
        <span style="font-size:8px;color:var(--text-muted);letter-spacing:0.1em">SCORE</span>
      </div>
    </div>
    <button onclick="window._selectAd('${ad.id}')" style="background:none;border:1px solid var(--border);color:var(--text-muted);font-size:10px;font-family:var(--font-mono);cursor:pointer;padding:4px 10px;border-radius:3px;margin-bottom:16px;letter-spacing:0.04em;width:100%">✕ Fechar painel</button>`;

  // Performance metrics
  const perfHtml = `
    <div class="drawer-section">
      <div class="drawer-section-title">Performance</div>
      ${[
        ["Investimento",   fmtCurrency(m.spend)],
        ["Impressões",     fmtNum(m.impressions)],
        ["Alcance",        fmtNum(m.reach)],
        ["Frequência",     fmtNum(m.frequency, 2)],
        ["Resultados",     fmtNum(m.results)],
        ["Custo/Resultado",fmtCurrency(m.costPerResult)],
        ["CTR",            fmtNum(m.ctr, 2, "%")],
        ["CPC",            fmtCurrency(m.cpc)],
        ["CPM",            fmtCurrency(m.cpm)],
        ["CVR",            m.cvr !== null ? fmtNum(m.cvr, 1, "%") : "N/D — sem dados de cliques"],
        ["Cliques (link)", m.linkClicks !== null ? fmtNum(m.linkClicks) : "N/D — campo não disponível"],
      ].map(([l,v]) => `<div class="drawer-metric"><span class="dm-label">${l}</span><span class="dm-val">${v}</span></div>`).join("")}
    </div>`;

  // Video retention (only if data exists)
  const hasVideo = m.videoPlays !== null;
  const videoHtml = hasVideo ? `
    <div class="drawer-section">
      <div class="drawer-section-title">Retenção de vídeo</div>
      ${[
        ["Reproduções",         fmtNum(m.videoPlays)],
        ["Hook Rate (P25%)",    m.hookRate     !== null ? fmtNum(m.hookRate, 1, "%")     : "N/D"],
        ["ThruPlay Rate",       m.thruplayRate !== null ? fmtNum(m.thruplayRate, 1, "%") : "N/D"],

    </div>` : "";

  // Conversion funnel
  const hasFunnel = m.impressions !== null && (m.linkClicks !== null || m.results !== null);
  const funnelHtml = hasFunnel ? (() => {
    const totalBase = m.impressions || 1;
    const steps = [
      { label: "Impressões",     val: m.impressions, pct: 100 },
      { label: "Cliques (link)", val: m.linkClicks,  pct: m.linkClicks  !== null ? (m.linkClicks  / totalBase) * 100 : null },

          </div>
          <div class="funnel-bar-track">
            <div class="funnel-bar-fill" style="width:${Math.min(100, s.pct || 100)}%;background:var(--cyan);opacity:0.65"></div>
          </div>
        </div>`).join("")}
    </div>`;
