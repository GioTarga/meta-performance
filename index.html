  // Fatigue
  const fatigueHtml = fatigueSignals.length > 0
    ? `<div class="drawer-section">
        <div class="drawer-section-title">⚠ Sinais de fadiga</div>
        ${fatigueSignals.map(s => `
          <div class="fatigue-item">
            <span style="color:${s.lvl === "red" ? "var(--red-text)" : "var(--amber-text)"}">●</span>
            <span style="color:var(--text-secondary)">${s.txt}</span>
          </div>`).join("")}
      </div>`
    : `<div class="drawer-section">
        <div class="drawer-section-title">Sinais de fadiga</div>
        <p style="font-size:11px;color:var(--text-muted);margin:0">✓ Nenhum sinal de fadiga identificado nos dados disponíveis.</p>
      </div>`;

  // DNA
  const dnaHtml = dnaTags.length > 0
    ? `<div class="drawer-section">
        <div class="drawer-section-title">DNA do criativo</div>
        <div>${dnaTags.map(t => `<span class="dna-tag">${t}</span>`).join("")}</div>
        <p style="font-size:10px;color:var(--text-muted);margin:8px 0 0;line-height:1.5">Inferido a partir do nome do anúncio. Revise se necessário.</p>
      </div>`
    : "";

  return previewHtml + headerHtml + perfHtml + videoHtml + funnelHtml + fatigueHtml + dnaHtml;
}

window._selectAd = function(id) {
  state.selectedAdId = state.selectedAdId === id ? null : id;
  render();
  if (state.selectedAdId) {
    setTimeout(() => {
      const drawer = document.getElementById("ad-drawer");
      if (drawer) drawer.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }, 60);
  }
};

function renderBenchmark() {
  const { campaigns, adSets } = state;
  const sumSpend = campaigns.reduce((s, c) => s + (c.metrics.spend || 0), 0);
  const sumResults = campaigns.reduce((s, c) => s + (c.metrics.results || 0), 0);
  const sumImpressions = campaigns.reduce((s, c) => s + (c.metrics.impressions || 0), 0);

  // CPM e CTR ponderados por impressões (igual ao Ads Manager)
  const cpm = sumSpend > 0 && sumImpressions > 0 ? (sumSpend / sumImpressions) * 1000 : null;
  const ctr = (() => {
    const valid = campaigns.filter(c => c.metrics.ctr !== null && c.metrics.impressions > 0);
    if (!valid.length) return null;
    const totalImp = valid.reduce((s, c) => s + c.metrics.impressions, 0);
    const totalClicks = valid.reduce((s, c) => s + (c.metrics.ctr / 100) * c.metrics.impressions, 0);
    return totalImp > 0 ? (totalClicks / totalImp) * 100 : null;
  })();
  const cprFromApiB = (() => {
    const valid = campaigns.filter(c => c.metrics.costPerResult !== null && c.metrics.results > 0);
    if (!valid.length) return null;
    const totalR = valid.reduce((s, c) => s + c.metrics.results, 0);
    return valid.reduce((s, c) => s + c.metrics.costPerResult * (c.metrics.results / totalR), 0);
  })();
  const cpr = cprFromApiB !== null ? cprFromApiB : (sumResults > 0 ? sumSpend / sumResults : null);

  const comps = [
    { label: "CPM", value: cpm, min: BENCHMARK.cpm.min, max: BENCHMARK.cpm.max, lowerBetter: true, isPct: false },
    { label: "CTR", value: ctr, min: BENCHMARK.ctr.min, max: BENCHMARK.ctr.max, lowerBetter: false, isPct: true },
    { label: "Custo por resultado", value: cpr, min: BENCHMARK.cpl.min, max: BENCHMARK.cpl.max, lowerBetter: true, isPct: false },
  ];

  const cards = comps.map(c => {
    const status = classifyRange(c.value, c.min, c.max, c.lowerBetter);
    const cfg = { green: ["Melhor que o mercado", "green"], amber: ["Próximo do limite", "amber"], red: ["Fora do benchmark", "red"], unknown: ["Benchmark não encontrado", "slate"] }[status];
    const diff = c.value !== null ? (((c.value - (c.lowerBetter ? c.max : c.min)) / (c.lowerBetter ? c.max : c.min)) * 100) : null;
    const interpretation = c.value === null ? "Dado não disponível na resposta da API." :
      status === "green" ? "Dentro ou melhor que a faixa de benchmark de mercado." :
      status === "red" ? "Fora do benchmark — isso pode estar pressionando o custo final por resultado." :
      "Próximo do limite — vale monitorar nos próximos dias.";
    return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <b style="font-size:13px">${c.label}</b><span class="badge ${cfg[1]}"><span class="dot"></span>${cfg[0]}</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;font-size:13px;margin-bottom:10px">
        <div><div style="font-size:11px;color:var(--text-muted)">Sua conta</div><b>${c.isPct ? fmtNum(c.value,2,"%") : fmtCurrency(c.value)}</b></div>
        <div><div style="font-size:11px;color:var(--text-muted)">Benchmark</div><b>${c.isPct ? `${c.min}–${c.max}%` : `${fmtCurrency(c.min)} – ${fmtCurrency(c.max)}`}</b></div>
        <div><div style="font-size:11px;color:var(--text-muted)">Diferença</div><b>${diff !== null ? `${diff > 0 ? "+" : ""}${diff.toFixed(0)}%` : "Não disponível"}</b></div>
      </div>
      <p style="font-size:13px;color:var(--text-secondary);margin:0">${interpretation}</p>
    </div>`;
  }).join("");

  return `<h1>Benchmark — Cliente × Mercado</h1><p class="subtitle">Referência Brasil, 2026</p>${cards}`;
}

function renderAlertas() {
  const alerts = generateAlerts(state.campaigns, state.adSets, state.ads);
  const groups = { critico: [], importante: [], oportunidade: [] };
  alerts.forEach(a => groups[a.level].push(a));
  const labels = { critico: "Crítico", importante: "Importante", oportunidade: "Oportunidade" };
  const icons = { critico: "\u{1F534}", importante: "\u{1F7E1}", oportunidade: "\u{1F7E2}" };

  const sections = Object.keys(groups).map(level => {
    const items = groups[level].map(a => `
      <div class="alert-card ${level}">
        <span class="level">${icons[level]} ${labels[level]}</span>
        <p class="problem">${esc(a.problem)}</p>
        <dl>
          <div><b>Causa:</b> ${esc(a.cause)}</div>
          <div><b>Impacto:</b> ${esc(a.impact)}</div>
          <div><b>Recomendação:</b> ${esc(a.recommendation)}</div>
        </dl>
      </div>`).join("");
    return `<div class="section"><h2>${labels[level]} (${groups[level].length})</h2>${items || '<p style="font-size:13px;color:var(--text-muted)">Nenhum alerta neste nível.</p>'}</div>`;
  }).join("");

  return `<h1>Central de alertas</h1><p class="subtitle">${alerts.length} alerta(s) identificado(s)</p>${sections}`;
}

function renderAndromeda() {
  const { campaigns, adSets, ads } = state;
  const perCampaign = campaigns.length > 0 ? (adSets.length / campaigns.length).toFixed(1) : "0";
  const perAdSet = adSets.length > 0 ? (ads.length / adSets.length).toFixed(1) : "0";
  const saturated = adSets.filter(a => a.saturationFlag).length;
  const recs = [];
  if (Number(perCampaign) > 2) recs.push(`Consolidar ad sets: a conta tem ${perCampaign} ad sets por campanha, acima da referência de 1–2.`);
  if (ads.length < 8) recs.push(`Aumentar diversidade de criativos: apenas ${ads.length} anúncio(s) ativo(s), abaixo da referência de 8–15.`);
  if (saturated > 0) recs.push(`Resolver saturação: ${saturated} ad set(s) com frequência acima do limite saudável.`);
  if (recs.length === 0) recs.push("Estrutura já está alinhada com a referência pós-Andromeda (1 campanha → 1–2 ad sets → 8–15 criativos diversos).");

  return `<h1>Diagnóstico Andromeda</h1><p class="subtitle">Avaliação estrutural frente ao motor de entrega atual</p>
    <div class="metrics-grid">
      <div class="metric-card"><div class="label">Campanhas ativas</div><div class="value">${campaigns.length}</div></div>
      <div class="metric-card"><div class="label">Ad sets ativos</div><div class="value">${adSets.length}</div></div>
      <div class="metric-card"><div class="label">Criativos ativos</div><div class="value">${ads.length}</div></div>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px">
      <b style="font-size:13px">Referência estrutural</b>
      <p style="font-size:13px;color:var(--text-secondary)">1 campanha → 1–2 ad sets → 8–15 criativos diversos (referência, não regra absoluta).</p>
      <p style="font-size:13px"><b>Concentração de orçamento:</b> ${perCampaign} ad sets por campanha em média.</p>
      <p style="font-size:13px"><b>Diversidade de criativos:</b> ${perAdSet} criativos por ad set em média.</p>
      <p style="font-size:13px"><b>Sinais de saturação:</b> ${saturated} de ${adSets.length} ad set(s) com frequência elevada.</p>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px">
      <b style="font-size:13px">Adaptações recomendadas</b>
      <ul style="font-size:13px;color:var(--text-secondary);padding-left:18px">${recs.map(r => `<li style="margin-bottom:6px">${esc(r)}</li>`).join("")}</ul>
    </div>`;
}

function renderPlano() {
  const alerts = generateAlerts(state.campaigns, state.adSets, state.ads);
  const items = alerts.map((a, i) => ({ ...a, order: i + 1 }));
  const icons = { critico: "\u{1F534}", importante: "\u{1F7E1}", oportunidade: "\u{1F7E2}" };
  const labels = { critico: "Crítico", importante: "Importante", oportunidade: "Oportunidade" };

  const cards = items.map(item => `
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span style="font-size:11px;color:var(--text-muted);font-family:monospace">${String(item.order).padStart(2,"0")}</span>
        <span>${icons[item.level]}</span>
        <span style="font-size:11px;font-weight:700;text-transform:uppercase">${labels[item.level]}</span>
      </div>
      <p style="font-weight:600;font-size:13px;margin:6px 0">${esc(item.problem)}</p>
      <p style="font-size:12px;color:var(--text-secondary);margin:4px 0"><b style="color:var(--text)">Causa:</b> ${esc(item.cause)}</p>
      <p style="font-size:12px;color:var(--text-secondary);margin:4px 0"><b style="color:var(--text)">Impacto:</b> ${esc(item.impact)}</p>
      <p style="font-size:12px;color:var(--text-secondary);margin:4px 0"><b style="color:var(--text)">Ação recomendada:</b> ${esc(item.recommendation)}</p>
    </div>`).join("");

  return `<h1>Plano de ação</h1><p class="subtitle">${items.length} ação(ões) priorizada(s)</p>${cards}`;
}

function renderConfiguracoes() {
  const maskedToken = state.token
    ? state.token.slice(0, 8) + "••••••••••••••••••••" + state.token.slice(-6)
    : "Nenhum token configurado";

  setTimeout(() => {
    const saveBtn = document.getElementById("save-token-btn");
    const disconnectBtn = document.getElementById("disconnect-btn");
    const tokenInput = document.getElementById("new-token-input");

    if (saveBtn) saveBtn.onclick = async () => {
      const val = tokenInput?.value.trim();
      if (!val) return;
      saveBtn.textContent = "Salvando…";
      saveBtn.disabled = true;
      state.token = val;
      localStorage.setItem("meta_perf_token", val);
      await bootstrapAccounts();
      state.currentPage = "overview";
      render();
    };

    if (disconnectBtn) disconnectBtn.onclick = () => {
      state.token = "";
      state.accountId = "";
      state.accounts = [];
      state.campaigns = [];
      state.adSets = [];
      state.ads = [];
      state.timeSeries = [];
      localStorage.removeItem("meta_perf_token");
      localStorage.removeItem("meta_perf_account");
      state.currentPage = "overview";
      render();
    };
  }, 50);

  return `
    <h1>Configurações</h1>
    <p class="subtitle">Gerenciar token de acesso e preferências</p>

    <div style="max-width:520px;display:flex;flex-direction:column;gap:16px">

      <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:24px">
        <p style="font-size:10px;font-weight:600;color:var(--cyan-dim);letter-spacing:0.08em;text-transform:uppercase;margin:0 0 6px">Token atual</p>
        <p style="font-size:12px;color:var(--text-secondary);font-family:var(--font-mono);margin:0 0 18px;word-break:break-all">${maskedToken}</p>

        <p style="font-size:10px;font-weight:600;color:var(--cyan-dim);letter-spacing:0.08em;text-transform:uppercase;margin:0 0 6px">Novo access token</p>
        <input
          id="new-token-input"
          type="password"
          placeholder="Cole o novo token aqui (EAA...)"
          style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:var(--font-mono);background:var(--bg);color:var(--text);margin-bottom:12px"
        />
        <button id="save-token-btn" class="primary" style="width:100%">Atualizar Token</button>
        <p style="font-size:11px;color:var(--text-muted);margin:10px 0 0;line-height:1.5">
          Gere um novo token em <span style="color:var(--cyan-dim)">developers.facebook.com/tools/explorer</span> → Estender token de acesso → cole aqui. Tokens estendidos duram ~60 dias.
        </p>
      </div>

      <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:24px">
        <p style="font-size:10px;font-weight:600;color:var(--red-text);letter-spacing:0.08em;text-transform:uppercase;margin:0 0 6px">Desconectar</p>
        <p style="font-size:12px;color:var(--text-secondary);margin:0 0 14px;line-height:1.5">Remove o token salvo e desconecta todas as contas. Você precisará colar um novo token para usar o app novamente.</p>
        <button id="disconnect-btn" class="secondary" style="border-color:rgba(255,59,92,0.4);color:var(--red-text)">Desconectar</button>
      </div>

    </div>`;
}

// ---------- Bootstrap ----------

async function bootstrapAccounts() {
  state.loading = true; state.error = null; render();
  try {
    state.accounts = await fetchAccounts();
    state.loading = false;
    if (state.accountId) { await loadAccountData(); }
    else { render(); }
  } catch (err) {
    state.loading = false; state.error = err.message; render();
  }
}

async function loadAccountData() {
  if (!state.accountId) { render(); return; }
  state.loading = true; state.error = null; render();
  try {
    const bundle = await fetchBundle(state.accountId);
    state.campaigns = bundle.campaigns; state.adSets = bundle.adSets; state.ads = bundle.ads;
    state.timeSeries = bundle.timeSeries;
    state.loading = false; render();
  } catch (err) {
    state.loading = false; state.error = err.message; render();
  }
}

(async function init() {
  if (state.token) { await bootstrapAccounts(); }
  else { render(); }
})();
</script>
</body>
</html>
